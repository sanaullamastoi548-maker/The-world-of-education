<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تعلیم کی دنیا</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #f3f8f5;
  color: #17312d;
}

/* HEADER */

header {
  background: linear-gradient(135deg,#064b45,#0b806f);
  color: white;
  text-align: center;
  padding: 30px 15px 38px;
}

.brand {
  display: inline-block;
  padding: 8px 18px;
  border: 1px solid #ffffff55;
  border-radius: 25px;
  background: #ffffff18;
}

h1 {
  font-size: 42px;
  margin: 14px 0 5px;
}

header p {
  margin: 0;
  font-size: 17px;
}

/* MAIN */

main {
  max-width: 1100px;
  margin: -20px auto 0;
  padding: 0 15px 40px;
}

/* SEARCH */

.search-box {
  background: white;
  padding: 13px;
  border-radius: 16px;
  box-shadow: 0 10px 28px #00000010;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #e1ece7;
  border-radius: 11px;
  font-size: 17px;
  font-family: inherit;
  outline: none;
}

input:focus {
  border-color: #0b806f;
}

/* GRID */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(270px,1fr));
  gap: 17px;
}

/* CARD */

.card {
  background: white;
  border: 1px solid #e1ece7;
  border-radius: 19px;
  overflow: hidden;
  box-shadow: 0 10px 28px #00000010;
  transition: transform 0.2s ease;
}

.card:hover {
  transform: translateY(-3px);
}

.card-header {
  background: #e9f5f0;
  padding: 17px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.letter {
  font-size: 55px;
  color: #075e54;
  font-weight: bold;
  line-height: 1.1;
}

.letter-name {
  font-size: 19px;
  color: #647873;
  margin-top: 4px;
}

/* BUTTONS */

button {
  font-family: inherit;
  cursor: pointer;
  transition: transform 0.1s ease, background 0.2s ease;
}

button:active {
  transform: scale(0.96);
}

.play-letter {
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: #075e54;
  color: white;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(7, 94, 84, 0.3);
}

.play-letter:hover {
  background: #0b806f;
}

/* WORDS */

.card-body {
  padding: 16px;
}

.words-title {
  font-size: 14px;
  color: #647873;
  margin-bottom: 10px;
  font-weight: bold;
}

.words {
  display: grid;
  gap: 9px;
}

.word-btn {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #e1ece7;
  border-radius: 11px;
  background: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: inherit;
  font-size: 18px;
  cursor: pointer;
  text-align: right;
  color: #17312d;
}

.word-btn:hover {
  background: #f2faf6;
  border-color: #9bcfc2;
}

.sound {
  color: #0b806f;
  font-size: 18px;
  background: #e9f5f0;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* MEDIA */

.media {
  margin-top: 15px;
  display: grid;
  gap: 12px;
}

.media img {
  width: 100%;
  max-height: 220px;
  object-fit: contain;
  border-radius: 12px;
  background: #f9fbf9;
  border: 1px solid #eef4f1;
}

/* FOOTER */

footer {
  text-align: center;
  color: #647873;
  padding: 25px;
  font-size: 15px;
}

@media(max-width:480px) {
  h1 {
    font-size: 32px;
  }
  .grid {
    grid-template-columns: 1fr;
  }
}

</style>
</head>

<body>

<header>
  <div class="brand">
    📚 تعلیم جو آسان سفر
  </div>
  <h1>تعلیم کی دنیا</h1>
  <p>اچو ته سنڌي اکر ۽ لفظ سکون</p>
</header>

<main>
  <div class="search-box">
    <input
      type="search"
      id="searchInput"
      placeholder="اکر يا لفظ ڳوليو..."
    >
  </div>

  <section id="cards" class="grid"></section>
</main>

<footer>
  تعلیم کی دنیا — سنڌي سکيا
</footer>

<script>

/* ==================================
   DIRECT HARDCODED DATA (NO GOOGLE SHEET)
================================== */

const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/sanaullamastoi548-maker/the-world-of-education/main/";

// یہاں حرف الف کے ساتھ آپ کی تصویر اور تینوں آڈیو فائلیں جوڑ دی گئی ہیں
const learningData = [
  {
    Letter: "ا",
    LetterName: "الف",
    LetterAudio: "media/audio/alif-ak.mp3",
    Image: "media/images/20261104_161107.jpg", // آپ کی تصویر کا نام یہاں لگ گیا ہے
    Word1: "اک",
    Word1Audio: "media/audio/alif-ak.mp3",
    Word2: "انب",
    Word2Audio: "media/audio/alif-anb.mp3",
    Word3: "اٺ",
    Word3Audio: "media/audio/alif-uth.mp3"
  }
];

const cards = document.getElementById("cards");
const searchInput = document.getElementById("searchInput");
let currentAudio = null;


/* ==================================
   DIRECT AUDIO PLAYER
================================== */

function playAudio(path) {
  if (!path) {
    alert("هن آواز جو لنڪ موجود ناهي.");
    return;
  }

  const finalUrl = GITHUB_RAW_BASE + path;

  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }

  currentAudio = new Audio(finalUrl);

  currentAudio.play().catch(error => {
    console.error("Audio play error:", error);
    alert("آڊيو هلائڻ ۾ مسئلو ٿيو. گিট ہب پر فائل کا نام چیک کریں۔");
  });
}


/* ==================================
   CREATE ELEMENT HELPER
================================== */

function createElement(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) {
    el.textContent = text;
  }
  return el;
}


/* ==================================
   RENDER CARDS
================================== */

function renderData(rows) {
  cards.replaceChildren();

  if (!rows.length) {
    cards.append(
      createElement("div", "empty", "ڪوبه اکر يا لفظ نه مليو.")
    );
    return;
  }

  rows.forEach(row => {
    const card = createElement("article", "card");
    const header = createElement("div", "card-header");
    const heading = document.createElement("div");

    heading.append(
      createElement("div", "letter", row.Letter || "؟"),
      createElement("div", "letter-name", row.LetterName || "")
    );

    /* LETTER AUDIO BUTTON */
    const letterButton = createElement("button", "play-letter", "▶");
    letterButton.type = "button";
    letterButton.title = "اکر جو آواز ٻڌو";
    letterButton.onclick = function() {
      playAudio(row.LetterAudio);
    };

    header.append(heading, letterButton);
    card.append(header);

    const body = createElement("div", "card-body");

    body.append(
      createElement("div", "words-title", "لفظن تي ڪلڪ ڪري آواز ٻڌو:")
    );

    /* WORDS WITH INDIVIDUAL AUDIO */
    const words = createElement("div", "words");

    for (let i = 1; i <= 3; i++) {
      const word = row["Word" + i];
      const audio = row["Word" + i + "Audio"];

      if (!word) continue;

      const button = createElement("button", "word-btn");
      button.type = "button";

      button.append(
        createElement("span", "", word),
        createElement("span", "sound", "🔊")
      );

      button.onclick = function() {
        playAudio(audio);
      };

      words.append(button);
    }

    body.append(words);

    /* MEDIA SECTION (IMAGE) */
    const media = createElement("div", "media");

    if (row.Image) {
      const img = document.createElement("img");
      img.src = GITHUB_RAW_BASE + row.Image;
      img.alt = row.Letter || "تصوير";
      img.loading = "lazy";
      img.onerror = function() {
        img.replaceWith(createElement("span", "", "تصوير نه کلي."));
      };
      media.append(img);
    }

    if (media.childNodes.length) {
      body.append(media);
    }

    card.append(body);
    cards.append(card);
  });
}


/* ==================================
   SEARCH FILTER
================================== */

searchInput.addEventListener("input", function() {
  const query = this.value.trim().toLowerCase();

  if (!query) {
    renderData(learningData);
    return;
  }

  const filtered = learningData.filter(row => {
    const values = [
      row.Letter,
      row.LetterName,
      row.Word1,
      row.Word2,
      row.Word3
    ];

    return values.some(value =>
      String(value || "").toLowerCase().includes(query)
    );
  });

  renderData(filtered);
});


/* ==================================
   START WEBSITE
================================== */

renderData(learningData);

</script>

</body>
</html>
