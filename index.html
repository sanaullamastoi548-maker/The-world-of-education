<title>تعليم جي دنيا</title>

    
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #edf4e9;
    color: #24452c;
}

button {
    font-family: inherit;
    cursor: pointer;
}

header {
    background: linear-gradient(120deg, #145d35, #329653);
    color: white;
    text-align: center;
    padding: 18px 10px;
    box-shadow: 0 3px 10px #0002;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 7px 0 0;
}

.main-layout {
    display: flex;
    flex-direction: row;
    min-height: calc(100vh - 110px);
}

.sidebar {
    width: 230px;
    min-width: 230px;
    background: #185b37;
    color: white;
    padding: 18px 12px;
}

.sidebar h2 {
    text-align: center;
    font-size: 21px;
    margin-top: 5px;
    padding-bottom: 12px;
    border-bottom: 1px solid #ffffff55;
}

.lesson-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.lesson-link {
    width: 100%;
    text-align: right;
    background: #ffffff18;
    color: white;
    border: 1px solid #ffffff35;
    border-radius: 9px;
    padding: 13px 12px;
    font-size: 16px;
}

.lesson-link.active {
    background: #f3c85b;
    color: #273b25;
    font-weight: bold;
}

.sidebar-toggle {
    display: none;
    width: calc(100% - 20px);
    margin: 10px;
    padding: 12px;
    background: #185b37;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 16px;
}

.content {
    flex: 1;
    padding: 25px 15px;
    min-width: 0;
}

.book {
    max-width: 850px;
    margin: auto;
    background: #fffdf5;
    min-height: 650px;
    border-radius: 12px;
    border: 1px solid #e4d9b9;
    box-shadow: 0 7px 22px #0002;
    padding: 22px;
}

.page-heading {
    text-align: center;
    color: #216a3b;
    font-size: 28px;
    margin: 5px 0 8px;
}

.page-number {
    text-align: center;
    color: #9b7831;
    font-size: 16px;
    margin-bottom: 20px;
}

.image-card {
    max-width: 650px;
    width: 100%;
    margin: auto;
    border: 4px solid #d9b95f;
    border-radius: 12px;
    padding: 5px;
    background: white;
    overflow: hidden;
}

.image-stage {
    width: 100%;
    position: relative;
    aspect-ratio: 1 / 1;
}

.lesson-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
}

.hotspot {
    position: absolute;
    border: 2px solid transparent;
    background: transparent;
    padding: 0;
    border-radius: 8px;
}

.hotspot:focus-visible {
    border: 3px solid #ff9800;
    outline: none;
}

.hotspot.active {
    border: 4px solid #ff9800;
    background: #ff980022;
}

.instruction {
    text-align: center;
    font-size: 18px;
    line-height: 1.8;
    margin: 20px 5px;
    color: #536b50;
}

.status {
    text-align: center;
    color: #247a43;
    min-height: 25px;
    font-size: 15px;
}

.page-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 25px;
    padding-top: 15px;
    border-top: 1px solid #e6dfc8;
}

.page-button {
    background: #247a43;
    color: white;
    border: none;
    padding: 12px 23px;
    border-radius: 9px;
    font-size: 16px;
}

.page-button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}

.current-page {
    color: #9b7831;
    font-weight: bold;
}

.video-area {
    text-align: center;
    margin: 15px;
}

.video-button {
    background: #d77c12;
    color: white;
    border: none;
    border-radius: 9px;
    padding: 12px 24px;
    font-size: 16px;
}

.video-player {
    display: none;
    width: 100%;
    max-width: 600px;
    margin: 15px auto;
    border-radius: 10px;
    background: black;
}

/* FOOTER */

footer {
    background: #185b37;
    color: white;
    text-align: center;
    padding: 20px 12px;
}

/* WRITING BUTTON */

.writing-link {
    display: inline-block;
    margin: 18px auto 5px;
    padding: 15px 28px;
    background: #f3c85b;
    color: #185b37;
    text-decoration: none;
    font-size: 20px;
    font-weight: bold;
    border: 3px solid white;
    border-radius: 12px;
    box-shadow: 0 4px 10px #0003;
}

.writing-link:hover {
    background: white;
    color: #185b37;
}

@media(max-width: 700px) {

    .main-layout {
        display: block;
    }

    .sidebar {
        display: none;
        width: 100%;
        min-width: 0;
    }

    .sidebar.open {
        display: block;
    }

    .sidebar-toggle {
        display: block;
    }

    .content {
        padding: 10px;
    }

    .book {
        padding: 12px;
        min-height: 500px;
    }

    .page-heading {
        font-size: 24px;
    }

    .page-button {
        padding: 11px 15px;
        font-size: 14px;
    }

    header h1 {
        font-size: 23px;
    }

    .writing-link {
        font-size: 18px;
        padding: 13px 20px;
    }
}
</style>
</head>

/* آواز جو نظام */

const player = document.getElementById("voicePlayer");
let activeButton = null;

function getFileURL(path) {
    if (!path) return "";

    if (
        path.startsWith("http://") ||
        path.startsWith("https://")
    ) {
        return path;
    }

    return RAW_ROOT + path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");
}

function stopAudio() {
    player.pause();
    player.currentTime = 0;
    player.removeAttribute("src");
    player.load();

    if (activeButton) {
        activeButton.classList.remove("active");
        activeButton = null;
    }
}

function playAudio(path, button) {
    stopAudio();

    if (!path) return;

    player.src = getFileURL(path);
    activeButton = button;
    button.classList.add("active");

    player.play().catch(function(error) {
        console.log("Audio Error:", error);
        showStatus("آواز هلائڻ ۾ مسئلو ٿيو. آڊيو فائل چيڪ ڪريو.");

        if (activeButton) {
            activeButton.classList.remove("active");
            activeButton = null;
        }
    });
}

player.addEventListener("ended", function() {
    if (activeButton) {
        activeButton.classList.remove("active");
        activeButton = null;
    }
});

player.addEventListener("error", function() {
    showStatus("آڊيو فائل نه ملي. ان جو نالو ۽ رستو چيڪ ڪريو.");
});


/* پيغام */

function showStatus(message) {
    const status = document.getElementById("statusMessage");

    if (status) {
        status.textContent = message;
    }
}


/* سائڊ بار */

function toggleSidebar() {
    document.getElementById("sidebar")
        .classList.toggle("open");
}


/* سبقن جي فهرست */

function renderSidebar() {
    const list = document.getElementById("lessonList");
    list.replaceChildren();

    lessons.forEach(function(lesson, index) {
        const button = document.createElement("button");

        button.className = "lesson-link";
        button.textContent = "سبق " + (index + 1) + " — " + lesson.title;

        button.onclick = function() {
            showLesson(index);
            document.getElementById("sidebar")
                .classList.remove("open");
        };

        if (index === currentIndex) {
            button.classList.add("active");
        }

        list.appendChild(button);
    });
}


/* سبق جو صفحو */

function showLesson(index) {
    if (index < 0 || index >= lessons.length) return;

    stopAudio();
    closeVideo();

    currentIndex = index;

    const lesson = lessons[index];
    const container = document.getElementById("lessonContainer");

    container.replaceChildren();

    const title = document.createElement("h2");
    title.className = "page-heading";
    title.textContent = lesson.title;
    container.appendChild(title);

    const number = document.createElement("div");
    number.className = "page-number";
    number.textContent = "سبق نمبر " + (index + 1);
    container.appendChild(number);

    const imageCard = document.createElement("div");
    imageCard.className = "image-card";

    const stage = document.createElement("div");
    stage.className = "image-stage";

    const image = document.createElement("img");
    image.className = "lesson-image";
    image.src = getFileURL(lesson.image);
    image.alt = lesson.title;

    image.onerror = function() {
        showStatus("تصوير لوڊ نه ٿي سگهي. تصوير جو نالو چيڪ ڪريو.");
    };

    stage.appendChild(image);

    lesson.items.forEach(function(item) {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "hotspot";
        button.title = item.label;
        button.setAttribute("aria-label", item.label);

        button.style.top = item.area.top + "%";
        button.style.left = item.area.left + "%";
        button.style.width = item.area.width + "%";
        button.style.height = item.area.height + "%";

        button.onclick = function() {
            playAudio(item.audio, button);
        };

        stage.appendChild(button);
    });

    imageCard.appendChild(stage);
    container.appendChild(imageCard);

    const instruction = document.createElement("p");
    instruction.className = "instruction";
    instruction.textContent = lesson.instruction || "";
    container.appendChild(instruction);

    const status = document.createElement("div");
    status.className = "status";
    status.id = "statusMessage";
    container.appendChild(status);

    if (lesson.video) {
        const videoArea = document.createElement("div");
        videoArea.className = "video-area";

        const videoButton = document.createElement("button");
        videoButton.className = "video-button";
        videoButton.textContent = "▶ وڊيو ڏسو";

        videoButton.onclick = function() {
            openVideo(lesson.video);
        };

        videoArea.appendChild(videoButton);

        const video = document.createElement("video");
        video.id = "lessonVideo";
        video.className = "video-player";
        video.controls = true;
        video.playsInline = true;

        videoArea.appendChild(video);
        container.appendChild(videoArea);
    }

    const controls = document.createElement("div");
    controls.className = "page-controls";

    const previous = document.createElement("button");
    previous.className = "page-button";
    previous.textContent = "→ پويون سبق";
    previous.disabled = index === 0;

    previous.onclick = function() {
        showLesson(currentIndex - 1);
    };

    const page = document.createElement("span");
    page.className = "current-page";
    page.textContent = (index + 1) + " / " + lessons.length;

    const next = document.createElement("button");
    next.className = "page-button";
    next.textContent = "اڳيون سبق ←";
    next.disabled = index === lessons.length - 1;

    next.onclick = function() {
        showLesson(currentIndex + 1);
    };

    controls.appendChild(previous);
    controls.appendChild(page);
    controls.appendChild(next);

    container.appendChild(controls);

    renderSidebar();
}


/* وڊيو */

function openVideo(path) {
    stopAudio();

    const video = document.getElementById("lessonVideo");
    if (!video) return;

    video.src = getFileURL(path);
    video.style.display = "block";

    video.play().catch(function(error) {
        console.log("Video Error:", error);
        showStatus("وڊيو هلائڻ ۾ مسئلو ٿيو.");
    });
}

function closeVideo() {
    const video = document.getElementById("lessonVideo");

    if (video) {
        video.pause();
        video.removeAttribute("src");
        video.load();
        video.style.display = "none";
    }
}


/* GitHub مان وڌيڪ سبق لوڊ ڪرڻ */

async function loadMoreLessons() {
    try {
        const response = await fetch(API_ROOT);

        if (!response.ok) {
            console.log("GitHub lessons folder not found.");
            return;
        }

        const folders = await response.json();

        const directories = folders.filter(function(item) {
            return item.type === "dir";
        });

        for (const folder of directories) {
            try {
                const path =
                    "media/lessons/" +
                    folder.name +
                    "/lesson.json";

                const jsonResponse = await fetch(getFileURL(path));

                if (!jsonResponse.ok) continue;

                const data = await jsonResponse.json();

                if (
                    !data.title ||
                    !data.image ||
                    !Array.isArray(data.items)
                ) {
                    continue;
                }

                const alreadyExists = lessons.some(function(item) {
                    return (
                        item.slug === folder.name ||
                        (
                            data.order &&
                            Number(item.order) === Number(data.order)
                        )
                    );
                });

                if (!alreadyExists) {
                    data.slug = folder.name;
                    lessons.push(data);
                }

            } catch (error) {
                console.log("سبق لوڊ نه ٿيو:", folder.name);
            }
        }

        lessons.sort(function(a, b) {
            return Number(a.order) - Number(b.order);
        });

        showLesson(currentIndex);

    } catch (error) {
        console.log("GitHub API Error:", error);
    }
}
