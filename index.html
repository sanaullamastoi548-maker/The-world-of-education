<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تعلیم کی دنیا</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #f3f8f5;
  color: #17312d;
}

/* HEADER */

header {
  background: linear-gradient(135deg,#064b45,#0b806f);
  color: white;
  text-align: center;
  padding: 30px 15px 38px;
}

.brand {
  display: inline-block;
  padding: 8px 18px;
  border: 1px solid #ffffff55;
  border-radius: 25px;
  background: #ffffff18;
}

h1 {
  font-size: 42px;
  margin: 14px 0 5px;
}

header p {
  margin: 0;
  font-size: 17px;
}

/* MAIN */

main {
  max-width: 1100px;
  margin: -20px auto 0;
  padding: 0 15px 40px;
}

/* SEARCH */

.search-box {
  background: white;
  padding: 13px;
  border-radius: 16px;
  box-shadow: 0 10px 28px #00000010;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #e1ece7;
  border-radius: 11px;
  font-size: 17px;
  font-family: inherit;
  outline: none;
}

input:focus {
  border-color: #0b806f;
}

/* STATUS */

#status {
  text-align: center;
  padding: 18px;
  color: #647873;
  font-size: 16px;
  font-weight: bold;
}

/* GRID */

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(270px,1fr));
  gap: 17px;
}

/* CARD */

.card {
  background: white;
  border: 1px solid #e1ece7;
  border-radius: 19px;
  overflow: hidden;
  box-shadow: 0 10px 28px #00000010;
  transition: transform 0.2s ease;
}

.card:hover {
  transform: translateY(-3px);
}

.card-header {
  background: #e9f5f0;
  padding: 17px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.letter {
  font-size: 55px;
  color: #075e54;
  font-weight: bold;
  line-height: 1.1;
}

.letter-name {
  font-size: 19px;
  color: #647873;
  margin-top: 4px;
}

/* BUTTONS */

button {
  font-family: inherit;
  cursor: pointer;
  transition: transform 0.1s ease, background 0.2s ease;
}

button:active {
  transform: scale(0.96);
}

.play-letter {
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: #075e54;
  color: white;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 10px rgba(7, 94, 84, 0.3);
}

.play-letter:hover {
  background: #0b806f;
}

/* WORDS */

.card-body {
  padding: 16px;
}

.words-title {
  font-size: 14px;
  color: #647873;
  margin-bottom: 10px;
  font-weight: bold;
}

.words {
  display: grid;
  gap: 9px;
}

.word-btn {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #e1ece7;
  border-radius: 11px;
  background: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: inherit;
  font-size: 18px;
  cursor: pointer;
  text-align: right;
  color: #17312d;
}

.word-btn:hover {
  background: #f2faf6;
  border-color: #9bcfc2;
}

.sound {
  color: #0b806f;
  font-size: 18px;
  background: #e9f5f0;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* IMAGE AND VIDEO */

.media {
  margin-top: 15px;
  display: grid;
  gap: 12px;
}

.media img {
  width: 100%;
  max-height: 220px;
  object-fit: contain;
  border-radius: 12px;
  background: #f9fbf9;
  border: 1px solid #eef4f1;
}

.media iframe {
  width: 100%;
  height: 210px;
  border: none;
  border-radius: 12px;
}

/* FOOTER */

.empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 35px;
  background: white;
  border-radius: 15px;
  color: #647873;
  font-size: 18px;
  box-shadow: 0 10px 28px #00000010;
}

footer {
  text-align: center;
  color: #647873;
  padding: 25px;
  font-size: 15px;
}

/* MOBILE RESPONSIVE */

@media(max-width:480px) {
  h1 {
    font-size: 32px;
  }
  .grid {
    grid-template-columns: 1fr;
  }
}

</style>
</head>

<body>

<header>
  <div class="brand">
    📚 تعلیم جو آسان سفر
  </div>
  <h1>تعلیم کی دنیا</h1>
  <p>اچو ته سنڌي اکر ۽ لفظ سکون</p>
</header>

<main>
  <div class="search-box">
    <input
      type="search"
      id="searchInput"
      placeholder="اکر يا لفظ ڳوليو..."
    >
  </div>

  <div id="status">
    ڊيٽا لوڊ ٿي رهي آهي...
  </div>

  <section id="cards" class="grid"></section>
</main>

<footer>
  تعلیم کی دنیا — سنڌي سکيا
</footer>

<script>

/* ==================================
   GOOGLE APPS SCRIPT CONNECTION
================================== */

const API_URL = "https://script.google.com/macros/s/AKfycbz2FM1hUkibcvAhnZIkfN5HPOhsYXgyHovWreWFZVGrx1yKk_32WS-qjyFUi8FDgyUf/exec";

const cards = document.getElementById("cards");
const statusBox = document.getElementById("status");
const searchInput = document.getElementById("searchInput");

let allRows = [];

// گلوبل آڈیو ابجیکٹ تاکہ آواز صاف اور بغیر پاپ اپ ونڈو کے چلے
let currentAudio = null;


/* ==================================
   GOOGLE DRIVE FILE ID EXTRACTOR
================================== */

function driveId(url) {
  if (!url) return "";
  const s = String(url).trim();
  let m =
    s.match(/\/file\/d\/([\w-]+)/) ||
    s.match(/[?&]id=([\w-]+)/) ||
    s.match(/\/d\/([\w-]+)/);
  return m ? m[1] : "";
}


/* ==================================
   AUDIO PLAYER (Advanced Fallback)
================================== */

function playAudio(url) {
  if (!url) {
    alert("هن آواز جو لنڪ موجود ناهي.");
    return;
  }

  let finalUrl = url.trim();
  const id = driveId(finalUrl);

  // اگر گوگل ڈرائیو کا لنک ہے تو اسے صحیح ڈاؤن لوڈ لنک بنائیں
  if (id) {
    finalUrl = "https://drive.google.com/uc?export=download&id=" + id;
  }

  const audio = new Audio(finalUrl);

  audio.play().then(() => {
    console.log("آڈیو کامیابی سے چل رہی ہے");
  }).catch((error) => {
    console.error("Play error:", error);
    
    // اگر براؤزر بلاک کر دے تو براہ راست نئے ٹیب یا ونڈو میں آڈیو پلے کر دیں
    window.open(finalUrl, "_blank");
  });
}


/* ==================================
   CREATE ELEMENT HELPER
================================== */

function createElement(tag, cls, text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) {
    el.textContent = text;
  }
  return el;
}


/* ==================================
   IMAGE URL CONVERTER
================================== */

function imageURL(url) {
  if (!url) return "";
  const id = driveId(url);
  if (!id) return url;
  return "https://drive.google.com/uc?export=view&id=" + id;
}


/* ==================================
   RENDER WEBSITE CARDS
================================== */

function renderData(rows) {
  cards.replaceChildren();

  if (!rows.length) {
    cards.append(
      createElement("div", "empty", "ڪوبه اکر يا لفظ نه مليو.")
    );
    return;
  }

  rows.forEach(row => {
    const card = createElement("article", "card");
    const header = createElement("div", "card-header");
    const heading = document.createElement("div");

    heading.append(
      createElement("div", "letter", row.Letter || "؟"),
      createElement("div", "letter-name", row.LetterName || "")
    );

    /* LETTER AUDIO BUTTON */
    const letterButton = createElement("button", "play-letter", "▶");
    letterButton.type = "button";
    letterButton.title = "اکر جو آواز ٻڌو";
    letterButton.onclick = function() {
      playAudio(row.LetterAudio);
    };

    header.append(heading, letterButton);
    card.append(header);

    const body = createElement("div", "card-body");

    body.append(
      createElement("div", "words-title", "لفظن تي ڪلڪ ڪري آواز ٻڌو:")
    );

    /* WORDS */
    const words = createElement("div", "words");

    for (let i = 1; i <= 3; i++) {
      const word = row["Word" + i];
      const audio = row["Word" + i + "Audio"];

      if (!word) continue;

      const button = createElement("button", "word-btn");
      button.type = "button";

      button.append(
        createElement("span", "", word),
        createElement("span", "sound", "🔊")
      );

      button.onclick = function() {
        playAudio(audio);
      };

      words.append(button);
    }

    body.append(words);

    /* IMAGE AND VIDEO MEDIA SECTION */
    const media = createElement("div", "media");

    /* IMAGE */
    if (row.Image) {
      const img = document.createElement("img");
      img.src = imageURL(row.Image);
      img.alt = row.Letter || "تصوير";
      img.loading = "lazy";
      img.onerror = function() {
        img.replaceWith(createElement("span", "", "تصوير نه کلي."));
      };
      media.append(img);
    }

    /* VIDEO */
    if (row.Video) {
      const videoId = driveId(row.Video);

      if (videoId) {
        const iframe = document.createElement("iframe");
        iframe.src = "https://drive.google.com/file/d/" + videoId + "/preview";
        iframe.title = "تعليمي وڊيو";
        iframe.allow = "autoplay; encrypted-media; picture-in-picture";
        iframe.allowFullscreen = true;
        media.append(iframe);
      } else {
        const video = document.createElement("video");
        video.src = row.Video;
        video.controls = true;
        video.playsInline = true;
        media.append(video);
      }
    }

    if (media.childNodes.length) {
      body.append(media);
    }

    card.append(body);
    cards.append(card);
  });
}


/* ==================================
   LOAD GOOGLE SHEET DATA VIA JSONP
================================== */

function loadData() {
  const callbackName = "educationWorldCallback_" + Date.now();
  const script = document.createElement("script");
  let finished = false;

  const timer = setTimeout(function() {
    if (finished) return;
    finished = true;
    delete window[callbackName];
    script.remove();
    statusBox.textContent = "ڊيٽا حاصل نه ٿي. Apps Script جي Deployment چيڪ ڪريو.";
  }, 20000);

  window[callbackName] = function(result) {
    if (finished) return;
    finished = true;
    clearTimeout(timer);
    delete window[callbackName];
    script.remove();

    if (!result || result.success !== true || !Array.isArray(result.data)) {
      statusBox.textContent = "Google Sheet مان صحيح ڊيٽا نه ملي.";
      return;
    }

    allRows = result.data;
    statusBox.textContent = allRows.length + " اکر ڪاميابي سان لوڊ ٿي ويا.";

    renderData(allRows);
  };

  script.onerror = function() {
    if (finished) return;
    finished = true;
    clearTimeout(timer);
    delete window[callbackName];
    statusBox.textContent = "Apps Script لنڪ يا نیٹ ورک ۾ مسئلو آهي.";
  };

  script.src = API_URL + "?callback=" + encodeURIComponent(callbackName) + "&t=" + Date.now();
  document.head.appendChild(script);
}


/* ==================================
   LIVE SEARCH FILTER
================================== */

searchInput.addEventListener("input", function() {
  const query = this.value.trim().toLowerCase();

  if (!query) {
    renderData(allRows);
    return;
  }

  const filtered = allRows.filter(row => {
    const values = [
      row.Letter,
      row.LetterName,
      row.Word1,
      row.Word2,
      row.Word3
    ];

    return values.some(value =>
      String(value || "").toLowerCase().includes(query)
    );
  });

  renderData(filtered);
});


/* ==================================
   START WEBSITE
================================== */

loadData();

</script>

</body>
</html>
