<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تعليم جي دنيا | سنڌي الفابيٽ</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Noto Naskh Arabic", "Noto Sans Arabic",
                 "Segoe UI", sans-serif;
    background:
        radial-gradient(circle at top, #eaffd7, transparent 45%),
        linear-gradient(135deg, #e5f8d5, #f7ffe9, #d7f0d1);
    color: #174b29;
    min-height: 100vh;
    padding: 15px;
}

.container {
    max-width: 850px;
    margin: auto;
}

/* مٿيون حصو */

.header {
    background: linear-gradient(135deg, #07552e, #12834b, #064326);
    color: white;
    text-align: center;
    padding: 22px 12px;
    border-radius: 25px;
    box-shadow: 0 8px 25px #174b2940;
    border: 3px solid #d6b64e;
    margin-bottom: 20px;
}

.header h1 {
    font-size: clamp(27px, 6vw, 40px);
    margin-bottom: 7px;
}

.header p {
    font-size: 16px;
    color: #fff3b7;
}

/* سبق جو عنوان */

.lesson {
    text-align: center;
    margin-bottom: 18px;
}

.lesson h2 {
    font-size: 32px;
    color: #07552e;
}

.lesson p {
    font-size: 17px;
    color: #53735a;
    margin-top: 5px;
}

/* تصوير */

.image-card {
    position: relative;
    background: white;
    padding: 9px;
    border-radius: 25px;
    border: 4px solid #d8b64b;
    box-shadow:
        0 10px 25px #174b2930,
        inset 0 0 12px #e8d58a;
    overflow: hidden;
}

.lesson-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: block;
    object-fit: contain;
    border-radius: 15px;
}

/* تصوير اندر لڪل ڇهڻ واريون جايون */

.hotspot {
    position: absolute;
    border: 0;
    background: transparent;
    cursor: pointer;
    border-radius: 35px;
    z-index: 5;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

/* اک */

.eye-zone {
    top: 9%;
    left: 1%;
    width: 49%;
    height: 30%;
}

/* انب */

.mango-zone {
    top: 40%;
    left: 55%;
    width: 43%;
    height: 30%;
}

/* اٺ */

.camel-zone {
    top: 72%;
    left: 1%;
    width: 57%;
    height: 25%;
}

/* آواز هلڻ وقت اثر */

.hotspot.playing {
    background: rgba(255, 222, 72, 0.12);
    box-shadow: 0 0 0 5px rgba(255, 205, 35, 0.65);
    animation: touchPulse 0.8s infinite alternate;
}

@keyframes touchPulse {
    from {
        box-shadow: 0 0 0 3px rgba(255,205,35,.25);
    }
    to {
        box-shadow: 0 0 0 9px rgba(255,205,35,.7);
    }
}

/* هدايت */

.instruction {
    background: #fff9d9;
    border: 2px dashed #d5ae36;
    padding: 15px;
    border-radius: 18px;
    text-align: center;
    margin-top: 18px;
    font-size: 17px;
    color: #6a5111;
}

/* وڊيو جو بٽڻ */

.video-section {
    text-align: center;
    margin: 22px 0;
}

.video-btn {
    background: linear-gradient(135deg, #f7b928, #e68a09);
    color: #422600;
    border: 3px solid #fff0ad;
    padding: 14px 30px;
    border-radius: 50px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 15px #a36b2538;
}

.video-btn:active {
    transform: scale(.96);
}

/* وڊيو پليئر */

.video-box {
    display: none;
    margin-top: 18px;
    background: #073d25;
    padding: 10px;
    border-radius: 20px;
}

.video-box video {
    width: 100%;
    border-radius: 14px;
    display: block;
}

.close-video {
    margin-top: 10px;
    background: #fff0b5;
    border: none;
    padding: 9px 22px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
}

/* هيٺيون حصو */

.footer {
    background: #07552e;
    color: white;
    text-align: center;
    padding: 17px;
    border-radius: 20px;
    margin-top: 25px;
    font-size: 15px;
}

.footer span {
    color: #ffdc64;
}

/* موبائل لاءِ */

@media(max-width: 500px) {
    body {
        padding: 9px;
    }

    .header {
        padding: 18px 8px;
        border-radius: 19px;
    }

    .lesson h2 {
        font-size: 27px;
    }

    .instruction {
        font-size: 15px;
    }

    .video-btn {
        font-size: 18px;
        padding: 12px 25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <h1>🌿 تعليم جي دنيا 🌿</h1>
        <p>اچو تہ سنڌي الفابيٽ راند ڪندي سکون</p>
    </header>

    <section class="lesson">
        <h2>ا ـ الف</h2>
        <p>تصوير ۾ موجود شين کي ڇُهي آواز ٻڌو</p>
    </section>

    <section class="image-card">

        <img
            class="lesson-image"
            src="media/images/20261104_161107.jpg"
            alt="الف، اک، انب ۽ اٺ"
        >

        <audio id="voicePlayer" preload="none"></audio>

        <!-- اک جو آواز -->
        <button
            type="button"
            class="hotspot eye-zone"
            aria-label="اک جو آواز ٻڌو"
            onclick="playVoice('media/media/audio/alif-ak.mp3', this)">
        </button>

        <!-- انب جو آواز -->
        <button
            type="button"
            class="hotspot mango-zone"
            aria-label="انب جو آواز ٻڌو"
            onclick="playVoice('media/media/audio/alif-anb.mp3', this)">
        </button>

        <!-- اٺ جو آواز -->
        <button
            type="button"
            class="hotspot camel-zone"
            aria-label="اٺ جو آواز ٻڌو"
            onclick="playVoice('media/media/audio/alif-uth.mp3', this)">
        </button>

    </section>

    <div class="instruction">
        👆 ٻارو! تصوير ۾ اک، انب يا اٺ کي ڇُهو
        ۽ انهن جا آواز ٻڌو.
    </div>

    <section class="video-section">

        <button class="video-btn" onclick="openVideo()">
            ▶ سبق جي وڊيو ڏسو
        </button>

        <div class="video-box" id="videoBox">

            <video id="lessonVideo" controls playsinline>
                <source src="media/videos/alif.mp4" type="video/mp4">
                اوهان جو برائوزر وڊيو هلائي نٿو سگهي.
            </video>

            <button class="close-video" onclick="closeVideo()">
                ✕ وڊيو بند ڪريو
            </button>

        </div>

    </section>

    <footer class="footer">
        <span>تعليم جي دنيا</span>
        <br>
        ٻارن لاءِ سکيا جو هڪ سهڻو سفر ❤️
    </footer>

</div>

<script>

const player = document.getElementById("voicePlayer");

let activeButton = null;

/* آواز هلائڻ */

function playVoice(file, button) {

    player.pause();
    player.currentTime = 0;

    document.querySelectorAll(".hotspot").forEach(item => {
        item.classList.remove("playing");
    });

    activeButton = button;

    player.src = file;
    player.load();

    player.play()
        .then(() => {
            button.classList.add("playing");
        })
        .catch(error => {
            console.error("Audio error:", error);
            alert("آواز نه هلي. مهرباني ڪري آڊيو فائل جو رستو چيڪ ڪريو.");
        });
}

/* آواز ختم ٿيڻ تي */

player.addEventListener("ended", function() {

    if (activeButton) {
        activeButton.classList.remove("playing");
        activeButton = null;
    }

});

/* وڊيو کولڻ */

function openVideo() {

    const box = document.getElementById("videoBox");
    const video = document.getElementById("lessonVideo");

    player.pause();

    document.querySelectorAll(".hotspot").forEach(item => {
        item.classList.remove("playing");
    });

    box.style.display = "block";

    video.play().catch(error => {
        console.log("Video playback:", error);
    });

    box.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}

/* وڊيو بند ڪرڻ */

function closeVideo() {

    const video = document.getElementById("lessonVideo");

    video.pause();
    video.currentTime = 0;

    document.getElementById("videoBox").style.display = "none";
}

</script>

</body>
</html>
