<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Graphic Design & Cartoon Tracing Board</title>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Comic Neue', Arial, sans-serif;
}

body {
    min-height: 100vh;
    padding: 15px 10px;
    background: linear-gradient(135deg, #e3f2fd, #fff9c4);
    color: #1a237e;
    display: flex;
    flex-direction: column;
    align-items: center;
}

header {
    text-align: center;
    margin-bottom: 12px;
}

h1 {
    color: #0d47a1;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
}

.nav-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.back-link, .nav-btn, .mode-btn {
    background: #ffb300;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
}

.nav-btn {
    background: #1976d2;
}

.mode-btn {
    background: #2e7d32;
}

.mode-btn.active-mode {
    background: #c62828 !important;
}

/* ڈیزائن سلیکٹر بار (20+ آپشنز کے لیے اسکرول ایبل) */
.design-selector {
    display: none;
    justify-content: flex-start;
    gap: 6px;
    margin-bottom: 12px;
    overflow-x: auto;
    max-width: 780px;
    padding-bottom: 5px;
}

.design-tab {
    background: #ffffff;
    border: 2px solid #1976d2;
    color: #1976d2;
    padding: 6px 14px;
    border-radius: 15px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
}

.design-tab.active {
    background: #1976d2;
    color: white;
}

.board-container {
    width: 100%;
    max-width: 780px;
    background: white;
    padding: 15px;
    border-radius: 22px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.1);
    border: 1px solid #bbdefb;
}

.board-toolbar {
    display: flex;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
    background: #f5f5f5;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid #e0e0e0;
}

.tool-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}

.color-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    cursor: pointer;
}

.color-btn.active {
    outline: 2px solid #1976d2;
}

.btn-size {
    padding: 6px 10px;
    font-size: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    font-weight: bold;
}

.btn-size.active {
    background: #1976d2;
    color: #fff;
    border-color: #1976d2;
}

.btn-eraser.active {
    background: #f57c00 !important;
    color: #fff !important;
}

.clear-btn {
    background: #d32f2f;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 8px 14px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
}

.download-btn {
    background: #388e3c;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 8px 14px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
}

/* ورک اسپیس لے آؤٹ */
.workspace-area {
    display: flex;
    gap: 15px;
    align-items: stretch;
}

.reference-panel {
    display: none;
    width: 170px;
    min-width: 170px;
    background: #fff8e1;
    border: 2px solid #ffca28;
    border-radius: 17px;
    padding: 12px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.reference-label {
    font-size: 13px;
    color: #e65100;
    font-weight: bold;
    margin-bottom: 8px;
    background: #ffe082;
    padding: 4px 10px;
    border-radius: 10px;
}

.reference-emoji {
    font-size: 85px;
    line-height: 1.1;
    margin: 10px 0;
}

.reference-hint {
    font-size: 12px;
    color: #6d4c41;
    line-height: 1.4;
}

.canvas-wrapper {
    position: relative;
    flex: 1;
    height: 360px;
    border: 2px solid #ffb300;
    border-radius: 17px;
    overflow: hidden;
    background-color: #ffffff;
    background-image: 
        linear-gradient(to bottom, transparent 39px, #90caf9 40px),
        linear-gradient(to bottom, transparent 79px, #e3f2fd 80px),
        linear-gradient(to bottom, transparent 119px, #90caf9 120px);
    background-size: 100% 120px;
}

.canvas-wrapper.design-mode {
    background-image: none !important;
    background-color: #ffffff;
}

.target-letter {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 135px;
    font-weight: 700;
    color: #e2f0d9;
    pointer-events: none;
    user-select: none;
}

.blueprint-layer {
    position: absolute;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    user-select: none;
}

.blueprint-layer svg {
    width: 250px;
    height: 250px;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
}

.info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    font-size: 14px;
    font-weight: bold;
    color: #37474f;
}

@media(max-width: 650px) {
    .workspace-area {
        flex-direction: column;
    }
    .reference-panel {
        width: 100%;
        flex-direction: row;
        justify-content: space-around;
        padding: 8px;
    }
    .reference-emoji {
        font-size: 55px;
        margin: 0;
    }
}
</style>
</head>

<body>

<header>
    <div class="nav-row">
        <a href="english.html" class="back-link">↩ Back to Menu</a>
        <button class="mode-btn" id="modeToggleBtn" onclick="toggleDesignMode()">🎨 Graphic Design & Cartoon Mode</button>
    </div>
    <h1 id="pageTitle">✍️ English Alphabet Writing Board</h1>
</header>

<div class="board-container">
    
    <div class="nav-row" id="letterNavRow" style="margin-bottom: 8px;">
        <button class="nav-btn" onclick="previousLetter()">◀ Previous</button>
        <span id="currentLetterDisplay" style="font-size: 22px; font-weight: 700; color: #1976d2; padding: 0 15px;">A</span>
        <button class="nav-btn" onclick="nextLetter()">Next ▶</button>
    </div>

    <!-- 20+ مختلف ڈیزائنز اور کارٹونز کی سلیکٹر بار -->
    <div class="design-selector" id="designSelector">
        <button class="design-tab active" onclick="selectDesign('circle', this)">⭕ Circle</button>
        <button class="design-tab" onclick="selectDesign('star', this)">⭐ Star</button>
        <button class="design-tab" onclick="selectDesign('sun', this)">☀️ Sun</button>
        <button class="design-tab" onclick="selectDesign('flower', this)">🌸 Flower</button>
        <button class="design-tab" onclick="selectDesign('ball', this)">⚽ Football</button>
        <button class="design-tab" onclick="selectDesign('house', this)">🏠 House</button>
        <button class="design-tab" onclick="selectDesign('car', this)">🚗 Car</button>
        <button class="design-tab" onclick="selectDesign('tree', this)">🌳 Tree</button>
        <button class="design-tab" onclick="selectDesign('boy', this)">👦 Boy</button>
        <button class="design-tab" onclick="selectDesign('girl', this)">👧 Girl</button>
        <button class="design-tab" onclick="selectDesign('cat', this)">🐱 Cat</button>
        <button class="design-tab" onclick="selectDesign('dog', this)">🐶 Dog</button>
        <button class="design-tab" onclick="selectDesign('fish', this)">🐠 Fish</button>
        <button class="design-tab" onclick="selectDesign('apple', this)">🍎 Apple</button>
        <button class="design-tab" onclick="selectDesign('banana', this)">🍌 Banana</button>
        <button class="design-tab" onclick="selectDesign('heart', this)">❤️ Heart</button>
        <button class="design-tab" onclick="selectDesign('teddy', this)">🧸 Teddy</button>
        <button class="design-tab" onclick="selectDesign('rocket', this)">🚀 Rocket</button>
        <button class="design-tab" onclick="selectDesign('umbrella', this)">☂️ Umbrella</button>
        <button class="design-tab" onclick="selectDesign('moon', this)">🌙 Moon</button>
    </div>

    <div class="board-toolbar">
        <div class="tool-group">
            <span style="font-size:12px; font-weight:bold;">Color:</span>
            <button class="color-btn active" style="background:#0d47a1" onclick="setColor('#0d47a1',this)"></button>
            <button class="color-btn" style="background:#c62828" onclick="setColor('#c62828',this)"></button>
            <button class="color-btn" style="background:#2e7d32" onclick="setColor('#2e7d32',this)"></button>
            <button class="color-btn" style="background:#ff8f00" onclick="setColor('#ff8f00',this)"></button>
        </div>

        <div class="tool-group">
            <span style="font-size:12px; font-weight:bold;">Size:</span>
            <button class="btn-size" onclick="setSize(3, this)">Thin</button>
            <button class="btn-size active" onclick="setSize(6, this)">Normal</button>
            <button class="btn-size" onclick="setSize(12, this)">Thick</button>
        </div>

        <div class="tool-group">
            <button class="btn-size btn-eraser" id="eraserBtn" onclick="toggleEraser()">🧽 Eraser</button>
            <button class="clear-btn" onclick="clearCanvas()">Clear</button>
            <button class="download-btn" onclick="downloadCanvas()">📥 Download</button>
        </div>
    </div>

    <div class="workspace-area">
        <div class="reference-panel" id="referencePanel">
            <div>
                <div class="reference-label">👀 Look & Draw</div>
                <div class="reference-emoji" id="refEmoji">⭕</div>
            </div>
            <div class="reference-hint">
                Draw inside the dotted outline!
            </div>
        </div>

        <div class="canvas-wrapper" id="canvasWrapper">
            <div class="target-letter" id="targetLetter">A</div>
            <div class="blueprint-layer" id="blueprintLayer"></div>
            <canvas id="writingBoard"></canvas>
        </div>
    </div>

    <div class="info-bar" id="infoBar">
        <span id="letterName">A - Apple</span>
        <span id="progress">Letter 1 / 26</span>
    </div>

</div>

<script>
const englishAlphabets = [
    {letter:"A", name:"A - Apple"}, {letter:"B", name:"B - Ball"}, {letter:"C", name:"C - Cat"},
    {letter:"D", name:"D - Dog"}, {letter:"E", name:"E - Elephant"}, {letter:"F", name:"F - Fish"},
    {letter:"G", name:"G - Goat"}, {letter:"H", name:"H - Horse"}, {letter:"I", name:"I - Ice cream"},
    {letter:"J", name:"J - Jug"}, {letter:"K", name:"K - Kite"}, {letter:"L", name:"L - Lion"},
    {letter:"M", name:"M - Monkey"}, {letter:"N", name:"N - Nest"}, {letter:"O", name:"O - Owl"},
    {letter:"P", name:"P - Parrot"}, {letter:"Q", name:"Q - Queen"}, {letter:"R", name:"R - Rose"},
    {letter:"S", name:"S - Sun"}, {letter:"T", name:"T - Tree"}, {letter:"U", name:"U - Umbrella"},
    {letter:"V", name:"V - Van"}, {letter:"W", name:"W - Watch"}, {letter:"X", name:"X - Xylophone"},
    {letter:"Y", name:"Y - Yak"}, {letter:"Z", name:"Z - Zebra"}

// 20 سے زائد مختلف کارٹون اور ڈیزائنز کے نقطوں والے نقشے (Blueprints)
const designTemplates = {
    circle: { emoji: "⭕", svg: `<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="75" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/><circle cx="100" cy="100" r="35" fill="none" stroke="#b0bec5" stroke-width="3" stroke-dasharray="5,5"/></svg>` },
    star: { emoji: "⭐", svg: `<svg viewBox="0 0 200 200"><polygon points="100,20 124,76 185,82 139,122 153,182 100,148 47,182 61,122 15,82 76,76" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6" stroke-linejoin="round"/></svg>` },
    sun: { emoji: "☀️", svg: `<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="42" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/><line x1="100" y1="10" x2="100" y2="42" stroke="#78909c" stroke-width="4" stroke-dasharray="6,4"/><line x1="100" y1="158" x2="100" y2="190" stroke="#78909c" stroke-width="4" stroke-dasharray="6,4"/><line x1="10" y1="100" x2="42" y2="100" stroke="#78909c" stroke-width="4" stroke-dasharray="6,4"/><line x1="158" y1="100" x2="190" y2="100" stroke="#78909c" stroke-width="4" stroke-dasharray="6,4"/></svg>` },
    flower: { emoji: "🌸", svg: `<svg viewBox="0 0 200 200"><circle cx="100" cy="65" r="25" fill="none" stroke="#78909c" stroke-width="3" stroke-dasharray="6,5"/><circle cx="100" cy="135" r="25" fill="none" stroke="#78909c" stroke-width="3" stroke-dasharray="6,5"/><circle cx="65" cy="100" r="25" fill="none" stroke="#78909c" stroke-width="3" stroke-dasharray="6,5"/><circle cx="135" cy="100" r="25" fill="none" stroke="#78909c" stroke-width="3" stroke-dasharray="6,5"/><circle cx="100" cy="100" r="15" fill="none" stroke="#e65100" stroke-width="3" stroke-dasharray="4,3"/></svg>` },
    ball: { emoji: "⚽", svg: `<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="75" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/><polygon points="100,70 120,85 112,110 88,110 80,85" fill="none" stroke="#78909c" stroke-width="3" stroke-dasharray="5,4"/></svg>` },
    house: { emoji: "🏠", svg: `<svg viewBox="0 0 200 200"><polygon points="100,30 30,90 170,90" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6" stroke-linejoin="round"/><rect x="45" y="90" width="110" height="80" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/><rect x="85" y="125" width="30" height="45" fill="none" stroke="#78909c" stroke-width="3" stroke-dasharray="5,4"/></svg>` },
    car: { emoji: "🚗", svg: `<svg viewBox="0 0 200 200"><rect x="35" y="90" width="130" height="45" rx="10" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/><path d="M 60 90 L 80 55 L 120 55 L 140 90 Z" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/><circle cx="65" cy="135" r="15" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="6,4"/><circle cx="135" cy="135" r="15" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="6,4"/></svg>` },
    tree: { emoji: "🌳", svg: `<svg viewBox="0 0 200 200"><rect x="88" y="115" width="24" height="60" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/><circle cx="100" cy="75" r="45" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/></svg>` },
    boy: { emoji: "👦", svg: `<svg viewBox="0 0 200 200"><circle cx="100" cy="80" r="45" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/><path d="M 55 135 Q 100 110 145 135 L 155 180 L 45 180 Z" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/></svg>` },
    girl: { emoji: "👧", svg: `<svg viewBox="0 0 200 200"><circle cx="100" cy="80" r="45" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/><path d="M 45 135 Q 100 100 155 135 L 165 180 L 35 180 Z" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/></svg>` },
    cat: { emoji: "🐱", svg: `<svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="50" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/><polygon points="60,65 50,30 80,50" fill="none" stroke="#78909c" stroke-width="3" stroke-dasharray="5,4"/><polygon points="140,65 150,30 120,50" fill="none" stroke="#78909c" stroke-width="3" stroke-dasharray="5,4"/></svg>` },
    dog: { emoji: "🐶", svg: `<svg viewBox="0 0 200 200"><circle cx="100" cy="105" r="50" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/><path d="M 55 75 Q 35 100 55 125" fill="none" stroke="#78909c" stroke-width="3" stroke-dasharray="5,4"/><path d="M 145 75 Q 165 100 145 125" fill="none" stroke="#78909c" stroke-width="3" stroke-dasharray="5,4"/></svg>` },
    fish: { emoji: "🐠", svg: `<svg viewBox="0 0 200 200"><ellipse cx="90" cy="100" rx="55" ry="35" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/><polygon points="145,100 175,70 175,130" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/></svg>` },
    apple: { emoji: "🍎", svg: `<svg viewBox="0 0 200 200"><circle cx="100" cy="105" r="50" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/><path d="M 100 55 Q 115 35 130 45" fill="none" stroke="#78909c" stroke-width="3" stroke-dasharray="5,4"/></svg>` },
    banana: { emoji: "🍌", svg: `<svg viewBox="0 0 200 200"><path d="M 50 140 Q 120 160 150 70 Q 130 110 50 140 Z" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/></svg>` },
    heart: { emoji: "❤️", svg: `<svg viewBox="0 0 200 200"><path d="M 100 155 C 40 110 30 70 55 50 C 75 35 95 55 100 70 C 105 55 125 35 145 50 C 170 70 160 110 100 155 Z" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6" stroke-linejoin="round"/></svg>` },
    teddy: { emoji: "🧸", svg: `<svg viewBox="0 0 200 200"><circle cx="100" cy="90" r="40" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/><circle cx="70" cy="55" r="15" fill="none" stroke="#78909c" stroke-width="3" stroke-dasharray="5,4"/><circle cx="130" cy="55" r="15" fill="none" stroke="#78909c" stroke-width="3" stroke-dasharray="5,4"/><circle cx="100" cy="140" r="35" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/></svg>` },
    rocket: { emoji: "🚀", svg: `<svg viewBox="0 0 200 200"><path d="M 100 30 Q 130 80 130 140 L 70 140 Q 70 80 100 30 Z" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/><polygon points="70,120 45,140 70,140" fill="none" stroke="#78909c" stroke-width="3" stroke-dasharray="5,4"/><polygon points="130,120 155,140 130,140" fill="none" stroke="#78909c" stroke-width="3" stroke-dasharray="5,4"/></svg>` },
    umbrella: { emoji: "☂️", svg: `<svg viewBox="0 0 200 200"><path d="M 40 100 Q 100 40 160 100 Q 130 85 100 100 Q 70 85 40 100 Z" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/><path d="M 100 100 L 100 150 Q 100 165 85 165" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="6,4"/></svg>` },
    moon: { emoji: "🌙", svg: `<svg viewBox="0 0 200 200"><path d="M 110 40 A 60 60 0 1 0 160 140 A 75 75 0 1 1 110 40 Z" fill="none" stroke="#78909c" stroke-width="4" stroke-dasharray="8,6"/></svg>` }
};

let currentIndex = 0;
let isDesignMode = false;
let currentDesignKey = 'circle';

const canvas = document.getElementById('writingBoard');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvasWrapper');

let isDrawing = false;
let currentColor = '#0d47a1';
let currentSize = 6;
let isEraser = false;
let points = [];

function updateBoardLetter() {
    if (isDesignMode) return;
    const item = englishAlphabets[currentIndex];
    document.getElementById("targetLetter").textContent = item.letter;
    document.getElementById("currentLetterDisplay").textContent = item.letter;
    document.getElementById("letterName").textContent = item.name;
    document.getElementById("progress").textContent = `Letter ${currentIndex + 1} / ${englishAlphabets.length}`;
    clearCanvas();
}

function nextLetter() {
    if (isDesignMode) return;
    currentIndex = (currentIndex + 1) % englishAlphabets.length;
    updateBoardLetter();
}

function previousLetter() {
    if (isDesignMode) return;
    currentIndex = (currentIndex - 1 + englishAlphabets.length) % englishAlphabets.length;
    updateBoardLetter();
}

function toggleDesignMode() {
    isDesignMode = !isDesignMode;
    const btn = document.getElementById("modeToggleBtn");
    const letterNav = document.getElementById("letterNavRow");
    const designSel = document.getElementById("designSelector");
    const targetLtr = document.getElementById("targetLetter");
    const refPanel = document.getElementById("referencePanel");
    const bpLayer = document.getElementById("blueprintLayer");
    const infoB = document.getElementById("infoBar");
    const pageTtl = document.getElementById("pageTitle");

    if (isDesignMode) {
        btn.textContent = "✍️ Back to Alphabet Board";
        btn.classList.add("active-mode");
        wrapper.classList.add("design-mode");
        letterNav.style.display = "none";
        targetLtr.style.display = "none";
        infoB.style.display = "none";
        designSel.style.display = "flex";
        refPanel.style.display = "flex";
        bpLayer.style.display = "flex";
        pageTtl.textContent = "🎨 Graphic Design & Cartoon Tracing";
        renderBlueprint();
    } else {
        btn.textContent = "🎨 Graphic Design & Cartoon Mode";
        btn.classList.remove("active-mode");
        wrapper.classList.remove("design-mode");
        letterNav.style.display = "flex";
        targetLtr.style.display = "flex";
        infoB.style.display = "flex";
        designSel.style.display = "none";
        refPanel.style.display = "none";
        bpLayer.style.display = "none";
        pageTtl.textContent = "✍️ English Alphabet Writing Board";
        updateBoardLetter();
    }
    setTimeout(resizeCanvas, 20);
    clearCanvas();
}

function selectDesign(key, tabBtn) {
    currentDesignKey = key;
    document.querySelectorAll(".design-tab").forEach(t => t.classList.remove("active"));
    if (tabBtn) tabBtn.classList.add("active");
    renderBlueprint();
    clearCanvas();
}

function renderBlueprint() {
    const template = designTemplates[currentDesignKey];
    document.getElementById("refEmoji").textContent = template.emoji;
    document.getElementById("blueprintLayer").innerHTML = template.svg;
}

// ڈرائنگ کو ڈاؤن لوڈ کرنے کا فنکشن
function downloadCanvas() {
    const link = document.createElement('a');
    link.download = 'my-drawing.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}

function resizeCanvas() {
    const rect = wrapper.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    if (canvas.width && canvas.height) {
        tempCanvas.getContext('2d').drawImage(canvas, 0, 0);
    }
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (tempCanvas.width && tempCanvas.height) {
        ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width / dpr, tempCanvas.height / dpr);
    }
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function setColor(color, btn) {
    isEraser = false;
    document.getElementById('eraserBtn').classList.remove('active');
    currentColor = color;
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
}

function setSize(size, btn) {
    currentSize = size;
    document.querySelectorAll('.btn-size:not(.btn-eraser)').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
}

function toggleEraser() {
    isEraser = !isEraser;
    const eraserBtn = document.getElementById('eraserBtn');
    if (isEraser) {
        eraserBtn.classList.add('active');
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    } else {
        eraserBtn.classList.remove('active');
    }
}

function clearCanvas() {
    const rect = wrapper.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
}

function getCoordinates(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    isDrawing = true;
    canvas.setPointerCapture(e.pointerId);
    const pos = getCoordinates(e);
    points = [pos];
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
});

canvas.addEventListener('pointermove', e => {
    if (!isDrawing) return;
    e.preventDefault();
    const pos = getCoordinates(e);
    points.push(pos);

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (isEraser) {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 25;
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        return;
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentSize;

    if (points.length >= 3) {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length - 1; i++) {
            const xc = (points[i].x + points[i + 1].x) / 2;
            const yc = (points[i].y + points[i + 1].y) / 2;
            ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
        }
        ctx.stroke();
    } else {
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }
});

function endPosition() {
    if (!isDrawing) return;
    isDrawing = false;
    points = [];
    ctx.closePath();
}

canvas.addEventListener('pointerup', endPosition);
canvas.addEventListener('pointercancel', endPosition);
canvas.addEventListener('lostpointercapture', endPosition);

updateBoardLetter();
</script>
