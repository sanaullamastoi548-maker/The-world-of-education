<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Writing Practice Board</title>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Comic Neue', Arial, sans-serif;
}

body {
    min-height: 100vh;
    padding: 15px 10px;
    background: linear-gradient(135deg, #e3f2fd, #fff9c4);
    color: #1a237e;
    display: flex;
    flex-direction: column;
    align-items: center;
}

header {
    text-align: center;
    margin-bottom: 12px;
}

h1 {
    color: #0d47a1;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
}

.nav-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.back-link, .nav-btn {
    background: #ffb300;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
}

.nav-btn {
    background: #1976d2;
}

.board-container {
    width: 100%;
    max-width: 650px;
    background: white;
    padding: 15px;
    border-radius: 22px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.1);
    border: 1px solid #bbdefb;
}

.board-toolbar {
    display: flex;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
    background: #f5f5f5;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid #e0e0e0;
}

.tool-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}

.color-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    cursor: pointer;
}

.color-btn.active {
    outline: 2px solid #1976d2;
}

.btn-size {
    padding: 6px 10px;
    font-size: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    font-weight: bold;
}

.btn-size.active {
    background: #1976d2;
    color: #fff;
    border-color: #1976d2;
}

.btn-eraser.active {
    background: #f57c00 !important;
    color: #fff !important;
}

.clear-btn {
    background: #d32f2f;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 8px 14px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
}

.canvas-wrapper {
    position: relative;
    width: 100%;
    height: 320px;
    border: 2px solid #ffb300;
    border-radius: 17px;
    overflow: hidden;
    background-color: #ffffff;
    /* انگلش فور لائن کاپی جیسی لکیریں */
    background-image: 
        linear-gradient(to bottom, transparent 39px, #90caf9 40px),
        linear-gradient(to bottom, transparent 79px, #e3f2fd 80px),
        linear-gradient(to bottom, transparent 119px, #90caf9 120px);
    background-size: 100% 120px;
}

.target-letter {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 130px;
    font-weight: 700;
    color: #e8f5e9;
    pointer-events: none;
    user-select: none;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
}

.info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    font-size: 14px;
    font-weight: bold;
    color: #37474f;
}
</style>
</head>

<body>

<header>
    <div class="nav-row">
        <a href="english.html" class="back-link">↩ Back to English Menu</a>
    </div>
    <h1>✍️ English Alphabet Writing Board</h1>
</header>

<div class="board-container">
    
    <div class="nav-row" style="margin-bottom: 12px;">
        <button class="nav-btn" onclick="previousLetter()">◀ Previous</button>
        <span id="currentLetterDisplay" style="font-size: 22px; font-weight: 700; color: #1976d2; padding: 0 15px;">A</span>
        <button class="nav-btn" onclick="nextLetter()">Next ▶</button>
    </div>

    <div class="board-toolbar">
        <div class="tool-group">
            <span style="font-size:12px; font-weight:bold;">Color:</span>
            <button class="color-btn active" style="background:#0d47a1" onclick="setColor('#0d47a1',this)"></button>
            <button class="color-btn" style="background:#c62828" onclick="setColor('#c62828',this)"></button>
            <button class="color-btn" style="background:#2e7d32" onclick="setColor('#2e7d32',this)"></button>
            <button class="color-btn" style="background:#424242" onclick="setColor('#424242',this)"></button>
        </div>

        <div class="tool-group">
            <span style="font-size:12px; font-weight:bold;">Size:</span>
            <button class="btn-size" onclick="setSize(3, this)">Thin</button>
            <button class="btn-size active" onclick="setSize(6, this)">Normal</button>
            <button class="btn-size" onclick="setSize(10, this)">Thick</button>
        </div>

        <div class="tool-group">
            <button class="btn-size btn-eraser" id="eraserBtn" onclick="toggleEraser()">🧽 Eraser</button>
            <button class="clear-btn" onclick="clearCanvas()">Clear</button>
        </div>
    </div>

    <div class="canvas-wrapper" id="canvasWrapper">
        <div class="target-letter" id="targetLetter">A</div>
        <canvas id="writingBoard"></canvas>
    </div>

    <div class="info-bar">
        <span id="letterName">A - Apple</span>
        <span id="progress">Letter 1 / 26</span>
    </div>

</div>

<script>
// انگلش اے بی سی کی فہرست
const englishAlphabets = [
    {letter:"A", name:"A - Apple"}, {letter:"B", name:"B - Ball"}, {letter:"C", name:"C - Cat"},
    {letter:"D", name:"D - Dog"}, {letter:"E", name:"E - Elephant"}, {letter:"F", name:"F - Fish"},
    {letter:"G", name:"G - Goat"}, {letter:"H", name:"H - Horse"}, {letter:"I", name:"I - Ice cream"},
    {letter:"J", name:"J - Jug"}, {letter:"K", name:"K - Kite"}, {letter:"L", name:"L - Lion"},
    {letter:"M", name:"M - Monkey"}, {letter:"N", name:"N - Nest"}, {letter:"O", name:"O - Owl"},
    {letter:"P", name:"P - Parrot"}, {letter:"Q", name:"Q - Queen"}, {letter:"R", name:"R - Rose"},
    {letter:"S", name:"S - Sun"}, {letter:"T", name:"T - Tree"}, {letter:"U", name:"U - Umbrella"},
    {letter:"V", name:"V - Van"}, {letter:"W", name:"W - Watch"}, {letter:"X", name:"X - Xylophone"},
    {letter:"Y", name:"Y - Yak"}, {letter:"Z", name:"Z - Zebra"}
];

let currentIndex = 0;
const canvas = document.getElementById('writingBoard');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvasWrapper');

let isDrawing = false;
let currentColor = '#0d47a1';
let currentSize = 6;
let isEraser = false;
let points = [];

function updateBoardLetter() {
    const item = englishAlphabets[currentIndex];
    document.getElementById("targetLetter").textContent = item.letter;
    document.getElementById("currentLetterDisplay").textContent = item.letter;
    document.getElementById("letterName").textContent = item.name;
    document.getElementById("progress").textContent = `Letter ${currentIndex + 1} / ${englishAlphabets.length}`;
    clearCanvas();
}

function nextLetter() {
    currentIndex = (currentIndex + 1) % englishAlphabets.length;
    updateBoardLetter();
}

function previousLetter() {
    currentIndex = (currentIndex - 1 + englishAlphabets.length) % englishAlphabets.length;
    updateBoardLetter();
}

function resizeCanvas() {
    const rect = wrapper.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    if (canvas.width && canvas.height) {
        tempCanvas.getContext('2d').drawImage(canvas, 0, 0);
    }
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (tempCanvas.width && tempCanvas.height) {
        ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width / dpr, tempCanvas.height / dpr);
    }
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function setColor(color, btn) {
    isEraser = false;
    document.getElementById('eraserBtn').classList.remove('active');
    currentColor = color;
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
}

function setSize(size, btn) {
    currentSize = size;
    document.querySelectorAll('.btn-size:not(.btn-eraser)').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
}

function toggleEraser() {
    isEraser = !isEraser;
    const eraserBtn = document.getElementById('eraserBtn');
    if (isEraser) {
        eraserBtn.classList.add('active');
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    } else {
        eraserBtn.classList.remove('active');
    }
}

function clearCanvas() {
    const rect = wrapper.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
}

function getCoordinates(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    isDrawing = true;
    canvas.setPointerCapture(e.pointerId);
    const pos = getCoordinates(e);
    points = [pos];
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
});

canvas.addEventListener('pointermove', e => {
    if (!isDrawing) return;
    e.preventDefault();
    const pos = getCoordinates(e);
    points.push(pos);

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (isEraser) {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 25;
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        return;
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentSize;

    if (points.length >= 3) {
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length - 1; i++) {
            const xc = (points[i].x + points[i + 1].x) / 2;
            const yc = (points[i].y + points[i + 1].y) / 2;
            ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
        }
        ctx.stroke();
    } else {
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    }
});

function endPosition() {
    if (!isDrawing) return;
    isDrawing = false;
    points = [];
    ctx.closePath();
}

canvas.addEventListener('pointerup', endPosition);
canvas.addEventListener('pointercancel', endPosition);
canvas.addEventListener('lostpointercapture', endPosition);

updateBoardLetter();
</script>

</body>
</html>
