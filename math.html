<!DOCTYPE html>
<html lang="sd" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعليم جي دنيا - گنتي (1 کان 10)</title>
    
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #edf4e9;
    color: #24452c;
}

button {
    font-family: inherit;
    cursor: pointer;
}

header {
    background: linear-gradient(120deg, #145d35, #329653);
    color: white;
    text-align: center;
    padding: 18px 10px;
    box-shadow: 0 3px 10px #0002;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 7px 0 0;
}

.language-switch {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 14px;
}

.language-btn {
    border: none;
    padding: 10px 22px;
    border-radius: 25px;
    font-size: 15px;
    font-weight: bold;
    background: white;
    color: #145d35;
    cursor: pointer;
    box-shadow: 0 3px 8px #0002;
    text-decoration: none;
    display: inline-block;
    transition: 0.2s ease;
}

.language-btn:hover, .language-btn.active {
    background: #f3c85b;
    color: #185b37;
    border: 2px solid white;
}

.main-layout {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 15px;
}

.book {
    background: #fffdf5;
    min-height: 500px;
    border-radius: 12px;
    border: 1px solid #e4d9b9;
    box-shadow: 0 7px 22px #0002;
    padding: 25px;
}

.page-heading {
    text-align: center;
    color: #216a3b;
    font-size: 26px;
    margin: 5px 0 20px;
}

.numbers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.num-card {
    background: white;
    border: 4px solid #d9b95f;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.num-img {
    width: 100%;
    max-width: 160px;
    height: 160px;
    object-fit: contain;
    margin-bottom: 10px;
    border: 2px dashed #145d35;
    border-radius: 8px;
    padding: 5px;
    background: #f9fbf7;
}

.digit-display {
    font-size: 28px;
    font-weight: bold;
    color: #145d35;
    margin-bottom: 5px;
}

.word-display {
    font-size: 18px;
    font-weight: bold;
    color: #9b7831;
    margin-bottom: 12px;
}

.voice-btn {
    background: #185b37;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: bold;
    margin: 5px;
}

.voice-btn:hover {
    background: #f3c85b;
    color: #185b37;
}

footer {
    background: #185b37;
    color: white;
    text-align: center;
    padding: 20px 12px;
    margin-top: 40px;
}

.back-link {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 20px;
    background: #f3c85b;
    color: #185b37;
    text-decoration: none;
    font-weight: bold;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>
    <h1>🔢 گنتي ۽ حساب (1 کان 10) 🔢</h1>
    <p>خالص سنڌي ٻوليءَ ۾ سکو</p>

    <div class="language-switch">
        <a class="language-btn" href="index.html">سنڌي (الف ب)</a>
        <a class="language-btn active" href="math.html">رياضي (گنتي)</a>
    </div>
</header>

<div class="main-layout">
    <div class="book">
        <h2 class="page-heading">سنڌي گنتي جا انگ ۽ آواز</h2>
        
        <div class="numbers-grid" id="mathGrid">
            <!-- جاوا اسکریپٹ کے ذریعے کارڈ یہاں لوڈ ہوں گے -->
        </div>
    </div>
</div>

<footer>
    <div>🌸 تعليم هر ٻار جو حق آهي 🌸</div>
    <br>
    <a href="index.html" class="back-link">← مکيه صفحي تي واپس وڃو</a>
</footer>

<audio id="voicePlayer"></audio>

<script>
const USERNAME = "sanaullamastoi548-maker";
const REPOSITORY = "The-world-of-education";
const BRANCH = "main";
const RAW_ROOT = `https://raw.githubusercontent.com/${USERNAME}/${REPOSITORY}/${BRANCH}/`;

// آپ کے دیے ہوئے ناموں کے مطابق 1 سے 10 تک خالص سندھی ڈیٹا
const mathData = [
    { num: 1, sdWord: "هڪ", img: "media/images/Hik Eko hik.jpg", audio: "media/media/audio/Hik Eko hik.mp3" },
    { num: 2, sdWord: "ٻه", img: "media/images/Ba Eko Ba .jpg", audio: "media/media/audio/Ba Eko Ba .mp3" },
    { num: 3, sdWord: "ٽي", img: "media/images/thri Eko thri .jpg", audio: "media/media/audio/tre Eko tre .mp3" },
    { num: 4, sdWord: "چار", img: "media/images/Char Eko char.jpg", audio: "media/media/audio/Char Eko char.mp3" },
    { num: 5, sdWord: "پنج", img: "media/images/Panj Eko panj.jpg", audio: "media/media/audio/Panj Eko panj.mp3" },
    { num: 6, sdWord: "ڇهه", img: "media/images/Cha Eko Cha.jpg", audio: "media/media/audio/Cha Eko Cha.mp3" },
    { num: 7, sdWord: "ست", img: "media/images/Sat Eko sat.jpg", audio: "media/media/audio/Sat Eko sat.mp3" },
    { num: 8, sdWord: "اٺ", img: "media/images/Atah Eko Atah.jpg", audio: "media/media/audio/Atah Eko Atah.mp3" },
    { num: 9, sdWord: "نون", img: "media/images/Naon Eko Nawn.jpg", audio: "media/media/audio/Nawon Eko Nawon.mp3" },
    { num: 10, sdWord: "ڏهه", img: "media/images/Day Eko Dah.jpg", audio: "media/media/audio/Dah Eko Dah.mp3" }
];

const player = document.getElementById("voicePlayer");

function getFileURL(path) {
    if (!path) return "";
    if (path.startsWith("http://") || path.startsWith("https://")) return path;
    return RAW_ROOT + path.split("/").map(part => encodeURIComponent(part)).join("/");
}

function playSound(path) {
    player.pause();
    player.src = getFileURL(path);
    player.play().catch(err => console.log("Audio error:", err));
}

function renderMath() {
    const grid = document.getElementById("mathGrid");
    grid.replaceChildren();

    mathData.forEach(item => {
        const card = document.createElement("div");
        card.className = "num-card";

        card.innerHTML = `
            <img src="${getFileURL(item.img)}" alt="${item.num}" class="num-img" onerror="this.src='https://via.placeholder.com/160?text=Number+${item.num}'">
            <div class="digit-display">${item.num}</div>
            <div class="word-display">${item.sdWord}</div>
            <div>
                <button class="voice-btn" onclick="playSound('${item.audio}')">🔊 آواز ٻڌو</button>
            </div>
        `;
        grid.appendChild(card);
    });
}

renderMath();
</script>

</body>
</html>
