<!DOCTYPE html>
<html lang="sd" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعليم جي دنيا - گنتي (1 کان 10)</title>
    
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #edf4e9;
    color: #24452c;
}

button {
    font-family: inherit;
    cursor: pointer;
}

header {
    background: linear-gradient(120deg, #145d35, #329653);
    color: white;
    text-align: center;
    padding: 18px 10px;
    box-shadow: 0 3px 10px #0002;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 7px 0 0;
}

.language-switch {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 14px;
}

.language-btn {
    border: none;
    padding: 10px 22px;
    border-radius: 25px;
    font-size: 15px;
    font-weight: bold;
    background: white;
    color: #145d35;
    cursor: pointer;
    box-shadow: 0 3px 8px #0002;
    text-decoration: none;
    display: inline-block;
    transition: 0.2s ease;
}

.language-btn:hover, .language-btn.active {
    background: #f3c85b;
    color: #185b37;
    border: 2px solid white;
}

.main-layout {
    max-width: 800px;
    margin: 25px auto;
    padding: 0 15px;
}

.book {
    background: #fffdf5;
    min-height: 520px;
    border-radius: 15px;
    border: 1px solid #e4d9b9;
    box-shadow: 0 7px 22px #0002;
    padding: 20px;
    text-align: center;
}

.page-heading {
    color: #216a3b;
    font-size: 26px;
    margin: 5px 0 5px;
}

.page-number {
    color: #9b7831;
    font-size: 16px;
    margin-bottom: 15px;
    font-weight: bold;
}

.single-card {
    background: white;
    border: 4px solid #d9b95f;
    border-radius: 15px;
    padding: 15px;
    max-width: 550px; /* کارڈ کو بڑا کیا گیا ہے */
    margin: 0 auto 15px auto;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

/* تصویر کو بڑا اور واضح کرنے کا اسٹائل */
.num-img {
    width: 100%;
    max-height: 360px;
    object-fit: contain;
    margin-bottom: 10px;
    border: 3px solid #145d35;
    border-radius: 12px;
    padding: 5px;
    background: #f9fbf7;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}

.num-img:hover {
    transform: scale(1.01);
    box-shadow: 0 0 15px rgba(243, 200, 91, 0.8);
}

.num-img.playing {
    border-color: #ff9800;
    box-shadow: 0 0 20px #ff9800;
}

.digit-display {
    font-size: 30px;
    font-weight: bold;
    color: #145d35;
    margin-bottom: 2px;
}

.word-display {
    font-size: 22px;
    font-weight: bold;
    color: #9b7831;
    margin-bottom: 5px;
}

.hint-text {
    font-size: 14px;
    color: #555;
    background: #fff9db;
    padding: 6px;
    border-radius: 8px;
    display: inline-block;
    margin-top: 5px;
}

.page-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #e6dfc8;
}

.page-button {
    background: #247a43;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
}

.page-button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}

.current-page {
    color: #9b7831;
    font-weight: bold;
    font-size: 18px;
}

footer {
    background: #185b37;
    color: white;
    text-align: center;
    padding: 20px 12px;
    margin-top: 40px;
}

.back-link {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 20px;
    background: #f3c85b;
    color: #185b37;
    text-decoration: none;
    font-weight: bold;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>
    <h1>🔢 گنتي ۽ حساب (1 کان 10) 🔢</h1>
    <p>خالص سنڌي ٻوليءَ ۾ سکو</p>

    <div class="language-switch">
        <a class="language-btn" href="index.html">سنڌي (الف ب)</a>
        <a class="language-btn active" href="math.html">رياضي (گنتي)</a>
    </div>
</header>

<div class="main-layout">
    <div class="book" id="bookContainer">
        <!-- جاوا اسکریپٹ کے ذریعے مواد یہاں آئے گا -->
    </div>
</div>

<footer>
    <div>🌸 تعليم هر ٻار جو حق آهي 🌸</div>
    <br>
    <a href="index.html" class="back-link">← مکيه صفحي تي واپس وڃو</a>
</footer>

<audio id="voicePlayer"></audio>

<script>
const USERNAME = "sanaullamastoi548-maker";
const REPOSITORY = "The-world-of-education";
const BRANCH = "main";
const RAW_ROOT = `https://raw.githubusercontent.com/${USERNAME}/${REPOSITORY}/${BRANCH}/`;

const mathData = [
    { num: 1, sdWord: "هڪ", img: "media/images/Hik Eko hik.jpg", audio: "media/media/audio/Hik Eko hik.mp3" },
    { num: 2, sdWord: "ٻه", img: "media/images/Ba Eko Ba .jpg", audio: "media/media/audio/Ba Eko Ba .mp3" },
    { num: 3, sdWord: "ٽي", img: "media/images/thri Eko thri .jpg", audio: "media/media/audio/tre Eko tre .mp3" },
    { num: 4, sdWord: "چار", img: "media/images/Char Eko char .jpg", audio: "media/media/audio/Char Eko char.mp3" },
    { num: 5, sdWord: "پنج", img: "media/images/Panj Eko panj.jpg", audio: "media/media/audio/Panj Eko panj.mp3" },
    { num: 6, sdWord: "ڇهه", img: "media/images/Cha Eko Cha.jpg", audio: "media/media/audio/Cha Eko Cha.mp3" },
    { num: 7, sdWord: "ست", img: "media/images/Sat Eko sat.jpg", audio: "media/media/audio/Sat Eko sat.mp3" },
    { num: 8, sdWord: "اٺ", img: "media/images/Atah Eko Atah.jpg", audio: "media/media/audio/Atah Eko Atah.mp3" },
    { num: 9, sdWord: "نون", img: "media/images/Naon Eko Nawn.jpg", audio: "media/media/audio/Nawon Eko Nawon.mp3" },
    { num: 10, sdWord: "ڏهه", img: "media/images/Day Eko Dah.jpg", audio: "media/media/audio/Dah Eko Dah.mp3" }
];

let currentIndex = 0;
const player = document.getElementById("voicePlayer");
let activeImgElement = null;

function getFileURL(path) {
    if (!path) return "";
    if (path.startsWith("http://") || path.startsWith("https://")) return path;
    return RAW_ROOT + path.split("/").map(part => encodeURIComponent(part)).join("/");
}

function playSound(path, imgElement) {
    if (activeImgElement) {
        activeImgElement.classList.remove("playing");
    }
    
    player.pause();
    player.src = getFileURL(path);
    
    activeImgElement = imgElement;
    if (activeImgElement) {
        activeImgElement.classList.add("playing");
    }

    player.play().catch(err => console.log("Audio error:", err));
}

player.addEventListener("ended", function() {
    if (activeImgElement) {
        activeImgElement.classList.remove("playing");
        activeImgElement = null;
    }
});

function showPage(index) {
    if (index < 0 || index >= mathData.length) return;
    currentIndex = index;
    const item = mathData[index];
    const container = document.getElementById("bookContainer");
    container.replaceChildren();

    const title = document.createElement("h2");
    title.className = "page-heading";
    title.textContent = "سنڌي گنتي سيکاريو";
    container.appendChild(title);

    const pageNum = document.createElement("div");
    pageNum.className = "page-number";
    pageNum.textContent = "صفحو " + (index + 1) + " / " + mathData.length;
    container.appendChild(pageNum);

    const card = document.createElement("div");
    card.className = "single-card";

    // تصویر جس پر کلک کرنے سے آواز چلے گی
    const imgElement = document.createElement("img");
    imgElement.src = getFileURL(item.img);
    imgElement.alt = item.num;
    imgElement.className = "num-img";
    imgElement.onerror = function() {
        this.src = 'https://via.placeholder.com/400?text=Number+' + item.num;
    };
    imgElement.onclick = function() {
        playSound(item.audio, imgElement);
    };
    card.appendChild(imgElement);

    const digitDisplay = document.createElement("div");
    digitDisplay.className = "digit-display";
    digitDisplay.textContent = item.num;
    card.appendChild(digitDisplay);

    const wordDisplay = document.createElement("div");
    wordDisplay.className = "word-display";
    wordDisplay.textContent = item.sdWord;
    card.appendChild(wordDisplay);

    const hint = document.createElement("div");
    hint.className = "hint-text";
    hint.textContent = "👆 آواز ٻڌڻ لاءِ تصوير تي ڪلڪ ڪريو";
    card.appendChild(hint);

    container.appendChild(card);

    // کنٹرولز (اگلا / پچھلا بٹن)
    const controls = document.createElement("div");
    controls.className = "page-controls";

    const prevBtn = document.createElement("button");
    prevBtn.className = "page-button";
    prevBtn.textContent = "← پويون";
    prevBtn.disabled = index === 0;
    prevBtn.onclick = function() {
        showPage(currentIndex - 1);
    };

    const pageIndicator = document.createElement("span");
    pageIndicator.className = "current-page";
    pageIndicator.textContent = (index + 1) + " منجهان " + mathData.length;

    const nextBtn = document.createElement("button");
    nextBtn.className = "page-button";
    nextBtn.textContent = "اڳيون →";
    nextBtn.disabled = index === mathData.length - 1;
    nextBtn.onclick = function() {
        showPage(currentIndex + 1);
    };

    controls.appendChild(prevBtn);
    controls.appendChild(pageIndicator);
    controls.appendChild(nextBtn);

    container.appendChild(controls);
}

showPage(0);
</script>

</body>
</html>
