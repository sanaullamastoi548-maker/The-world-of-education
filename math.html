    { num: 98, title: "اٺانوي", img: "media/images/ath Eka nawon D 98.jpg", audio: "media/media/audio/ath Eka nawon D 98.mp3" },
    { num: 99, title: "نوانوي", img: "media/images/nawon Eka nawon D 99.jpg", audio: "media/media/audio/nawon Eka nawon D 99.mp3" },
    { num: 100, title: "سؤ", img: "media/images/buri Eko Dah d 100.jpg", audio: "media/media/audio/buri Eko Dah d 100.mp3" }
];

let currentIndex = 0;
const player = document.getElementById("voicePlayer");
let activeImgElement = null;
const sidebarButtons = [];

function getFileURL(path) {
    if (!path) return "";
    if (path.startsWith("http://") || path.startsWith("https://")) return path;
    return RAW_ROOT + path.split("/").map(part => encodeURIComponent(part)).join("/");
}

function playSound(path, imgElement) {
    if (activeImgElement) {
        activeImgElement.classList.remove("playing");
    }

    player.pause();
    player.src = getFileURL(path);

    activeImgElement = imgElement;
    if (activeImgElement) {
        activeImgElement.classList.add("playing");
    }

    player.play().catch(err => console.log("Audio error:", err));
}

player.addEventListener("ended", function() {
    if (activeImgElement) {
        activeImgElement.classList.remove("playing");
        activeImgElement = null;
    }
});

function buildSidebar() {
    const sidebar = document.getElementById("numberSidebar");
    mathData.forEach((item, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "side-num-btn";
        btn.textContent = item.num;
        btn.onclick = function() {
            showPage(idx);
        };
        sidebar.appendChild(btn);
        sidebarButtons.push(btn);
    });
}

function updateSidebarActive(index) {
    sidebarButtons.forEach((btn, idx) => {
        btn.classList.toggle("active", idx === index);
    });
    if (sidebarButtons[index]) {
        sidebarButtons[index].scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
}

function showPage(index) {
    if (index < 0 || index >= mathData.length) return;
    currentIndex = index;
    const item = mathData[index];
    const container = document.getElementById("bookContainer");
    container.replaceChildren();

    updateSidebarActive(index);

    const title = document.createElement("h2");
    title.className = "page-heading";
    title.textContent = "سنڌي گنتي سکو";
    container.appendChild(title);

    const pageNum = document.createElement("div");
    pageNum.className = "page-number";
    pageNum.textContent = "انگ " + item.num + " — صفحو " + (index + 1) + " / " + mathData.length;
    container.appendChild(pageNum);

    const card = document.createElement("div");
    card.className = "single-card";

    const imgElement = document.createElement("img");
    imgElement.src = getFileURL(item.img);
    imgElement.alt = item.title;
    imgElement.className = "num-img";
    imgElement.onerror = function() {
        this.src = 'https://via.placeholder.com/400?text=Counting+' + item.num;
    };
    imgElement.onclick = function() {
        playSound(item.audio, imgElement);
    };
    card.appendChild(imgElement);

    const wordDisplay = document.createElement("div");
    wordDisplay.className = "word-display";
    wordDisplay.textContent = item.num + " — " + item.title;
    card.appendChild(wordDisplay);

    const hint = document.createElement("div");
    hint.className = "hint-text";
    hint.textContent = "👆 آواز ٻڌڻ لاءِ تصوير تي ڪلڪ ڪريو";
    card.appendChild(hint);

    container.appendChild(card);

    const controls = document.createElement("div");
    controls.className = "page-controls";

    const prevBtn = document.createElement("button");
    prevBtn.className = "page-button";
    prevBtn.textContent = "← پويون";
    prevBtn.disabled = index === 0;
    prevBtn.onclick = function() {
        showPage(currentIndex - 1);
    };

    const pageIndicator = document.createElement("span");
    pageIndicator.className = "current-page";
    pageIndicator.textContent = (index + 1) + " منجهان " + mathData.length;

    const nextBtn = document.createElement("button");
    nextBtn.className = "page-button";
    nextBtn.textContent = "اڳيون →";
    nextBtn.disabled = index === mathData.length - 1;
    nextBtn.onclick = function() {
        showPage(currentIndex + 1);
    };

    controls.appendChild(prevBtn);
    controls.appendChild(pageIndicator);
    controls.appendChild(nextBtn);

    container.appendChild(controls);
}

buildSidebar();
showPage(0);
</script>

</body>
</html>
