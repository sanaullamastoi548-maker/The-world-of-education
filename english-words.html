<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Alphabet - Learn and Speak</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:linear-gradient(135deg,#e8fff3,#fff7df);color:#17352c;padding:15px 10px}
header{text-align:center;margin-bottom:15px}
h1{color:#07523d;font-size:clamp(22px,4vw,30px);margin-bottom:6px}
.subtitle{color:#557267;line-height:1.6;font-size:15px}
.container{max-width:950px;margin:auto}
.card{background:white;padding:15px;border-radius:22px;box-shadow:0 8px 25px #174c3610;text-align:center;border:1px solid #d9e9e1}

/* تصویر کو بڑا اور واضح دکھانے کے لیے کنٹینر */
.image-container {
    position: relative;
    display: inline-block;
    max-width: 600px; /* تصویر کا سائز بڑا کر دیا گیا ہے */
    width: 100%;
    margin: 10px auto;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
}

.lesson-image{
    width: 100%;
    height: auto;
    display: block;
}

/* تصویر کے تینوں خانوں کے عین مطابق ٹچ زونز */
.touch-zone {
    position: absolute;
    left: 4%;
    width: 92%;
    height: 23.5%; /* ہر خانے کی بالکل درست اونچائی */
    cursor: pointer;
    border-radius: 14px;
    transition: background-color 0.2s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
}

/* ٹچ کرنے پر ہلکا سا چمکنے والا ایفیکٹ */
.touch-zone:active {
    background-color: rgba(255, 255, 255, 0.28);
    transform: scale(0.98);
}

/* پہلا خانہ (Apple, Ball, Cat...) */
.zone-1 { top: 25%; }

/* دوسرا خانہ (Ant, Banana, Cow...) */
.zone-2 { top: 50%; }

/* تیسرا خانہ (Aeroplane, Butterfly, Cake...) */
.zone-3 { top: 75%; }

.status{
    color:#b45309;
    background:#fff9db;
    border:1px solid #ffe066;
    display:inline-block;
    padding:6px 16px;
    border-radius:20px;
    font-weight:bold;
    min-height:32px;
    font-size:15px;
    margin-bottom:8px;
}

.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:14px 0}
button,a{border:0;border-radius:25px;padding:12px 22px;font-weight:bold;font-size:15px;cursor:pointer;text-decoration:none}
.primary{background:#087f5b;color:white}
.secondary{background:#e8f4ed;color:#07523d}
.back{background:#e5a000;color:white}

.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:15px}
.grid button{background:#f1f8f3;color:#07523d;border:1px solid #dcebe3;padding:12px 5px;font-size:17px}
.grid button.active{background:#087f5b;color:white}
footer{text-align:center;color:#789086;margin:18px;font-size:14px}

@media(max-width:600px){
    .grid{grid-template-columns:repeat(5,1fr)}
    .card{padding:10px}
}
</style>
</head>

<body>

<header>
<h1>📚 English Alphabet - Learn and Speak</h1>
<p class="subtitle">تصویر کے جس خانے پر چاہیں ٹچ کریں اور آواز سنیں!</p>
</header>

<div class="container">
<div class="card">

<div>
    <div class="status" id="status">تصویر کے کسی بھی خانے پر ٹچ کریں!</div>
</div>

<!-- بڑی تصویر اور اس کے تینوں خانوں کے بالکل اوپر فٹ کیے گئے ٹچ بٹن -->
<div class="image-container">
    <img id="lessonImage" class="lesson-image" src="" alt="Alphabet Image">
    
    <!-- تینوں خانوں کے ٹچ بٹن -->
    <div class="touch-zone zone-1" onclick="playPartAudio(0)" title="پہلا لفظ سنیں"></div>
    <div class="touch-zone zone-2" onclick="playPartAudio(1)" title="دوسرا لفظ سنیں"></div>
    <div class="touch-zone zone-3" onclick="playPartAudio(2)" title="تیسرا لفظ سنیں"></div>
</div>

<div class="buttons">
<button class="secondary" onclick="previousWord()">◀ پچھلا حرف</button>
<button class="primary" onclick="nextWord()">اگلا حرف ▶</button>
</div>

<div class="grid" id="wordGrid"></div>

<div class="buttons" style="margin-top:15px;">
<a class="back" href="english.html">↩ مین مینو پر واپس جائیں</a>
</div>

</div>
</div>

<footer>Learning English is fun! ❤️</footer>

<audio id="audioPlayer" preload="none"></audio>

<script>
// =====================================
// آپ کے دیے گئے بالکل درست فائل نام (Images اور Audios)
// =====================================

const alphabetData = [
    {
        letter: "A",
        image: "media/images/A for A.jpg",
        audios: [
            "media/english-audio/A for Apple .mp3",
            "media/english-audio/A for Ant.mp3",
            "media/english-audio/A for  Aeroplane .mp3",
        ],
        names: ["A for Apple", "A for Ant", "A for Aeroplane"]
    },
    {
        letter: "B",
        image: "media/images/B for B.jpg",
        audios: [
            "media/english-audio/B for Ball.mp3",
            "media/english-audio/B for Banana.mp3",
            "media/english-audio/B for Butterfly.mp3",
        ],
        names: ["B for Ball", "B for Banana", "B for Butterfly"]
    },
    {
        letter: "C",
        image: "media/images/C for c.jpg",
        audios: [
            "media/english-audio/C for Cat.mp3",
            "media/english-audio/C for Cow.mp3",
            "media/english-audio/C for cake.mp3",
        ],
        names: ["C for Cat", "C for Cow", "C for Cake"]
    },
    {
        letter: "D",
        image: "media/images/D for D.jpg",
        audios: [
            "media/english-audio/D for Dog.mp3",
            "media/english-audio/D for Duck.mp3",
            "media/english-audio/D for Doll.mp3",
        ],
        names: ["D for Dog", "D for Duck", "D for Doll"]
    },
    {
        letter: "E",
        image: "media/images/E for E.jpg",
        audios: [
            "media/english-audio/E for Elephant.mp3",
            "media/english-audio/E for Egg.mp3",
            "media/english-audio/E for Eagle.mp3",
        ],
        names: ["E for Elephant", "E for Egg", "E for Eagle"]
    },
    {
        letter: "F",
        image: "media/images/F for F.jpg",
        audios: [
            "media/english-audio/F for Fish.mp3",
            "media/english-audio/F for frog.mp3",
            "media/english-audio/F for fan.mp3",
        ],
        names: ["F for Fish", "F for Frog", "F for Fan"]
    },
    {
        letter: "G",
        image: "media/images/G for G.jpg",
        audios: [
            "media/english-audio/G for Grapes.mp3",
            "media/english-audio/G for Goat.mp3",
            "media/english-audio/G for Giraffe.mp3",
        ],
        names: ["G for Grapes", "G for Goat", "G for Giraffe"]
    },
    {
        letter: "H",
        image: "media/images/H for H.jpg",
        audios: [
            "media/english-audio/H for  Hen .mp3",
            "media/english-audio/H for horse .mp3",
            "media/english-audio/H for house.mp3",
        ],
        names: ["H for Hen", "H for Horse", "H for House"]
    },
    {
        letter: "I",
        image: "media/images/I for I.jpg",
        audios: [
            "media/english-audio/I for Ice cream.mp3",
            "media/english-audio/I for inkpot.mp3",
            "media/english-audio/I for insect.mp3",
        ],
        names: ["I for Ice Cream", "I for Inkpot", "I for Insect"]
    },
    {
        letter: "J",
        image: "media/images/J for J.jpg",
        audios: [
            "media/english-audio/J for Jug .mp3",
            "media/english-audio/J for Juice .mp3",
            "media/english-audio/J for Juggler .mp3",
        ],
        names: ["J for Jug", "J for Juice", "J for Juggler"]
    }
];

let currentIndex = 0;

const image = document.getElementById("lessonImage");
const statusBox = document.getElementById("status");
const player = document.getElementById("audioPlayer");
const grid = document.getElementById("wordGrid");

// حروف کے بٹن بنانا
alphabetData.forEach((item, index) => {
    const button = document.createElement("button");
    button.textContent = item.letter;
    button.onclick = () => showLetter(index);
    grid.appendChild(button);
});

// حرف تبدیل کرنے کا فنکشن
function showLetter(index) {
    currentIndex = (index + alphabetData.length) % alphabetData.length;
    const item = alphabetData[currentIndex];

    image.style.opacity = "0.5";
    statusBox.textContent = "تصویر لوڈ ہو رہی ہے...";

    image.onload = () => {
        image.style.opacity = "1";
        statusBox.textContent = "حرف " + item.letter + " - کسی بھی خانے پر ٹچ کریں!";
    };

    image.onerror = () => {
        image.style.opacity = "1";
        statusBox.textContent = "تصویر نہیں ملی: " + item.image;
    };

    image.src = item.image;

    document.querySelectorAll(".grid button").forEach((btn, i) => {
        btn.classList.toggle("active", i === currentIndex);
    });

    player.pause();
    player.currentTime = 0;
}

// تصویر کے مخصوص خانے پر کلک کرنے سے صرف اسی کی آڈیو چلے گی
function playPartAudio(partIndex) {
    const item = alphabetData[currentIndex];
    const audioPath = item.audios[partIndex];
    const partName = item.names[partIndex];

    statusBox.textContent = "🔊 " + partName;

    player.pause();
    player.currentTime = 0;
    player.src = audioPath;

    player.play().catch(() => {
        statusBox.textContent = "آڈیو فائل نہیں ملی: " + audioPath;
    });
}

function nextWord() {
    showLetter(currentIndex + 1);
}

function previousWord() {
    showLetter(currentIndex - 1);
}

// شروع کرتے وقت پہلا حرف دکھائیں
showLetter(0);
</script>
</body>
</html>
