.hint-text {

    align-items: center;

    margin-top: 20px;

    background: #247a43;

    border: none;

    border-radius: 10px;

    .main-layout {

<body>

        <a class="language-btn" href="index.html">Home</a>

<audio id="voicePlayer"></audio>

<script>
const USERNAME = "sanaullamastoi548-maker";
const REPOSITORY = "The-world-of-education";
const BRANCH = "main";
const RAW_ROOT = `https://raw.githubusercontent.com/${USERNAME}/${REPOSITORY}/${BRANCH}/`;

const IMG_DIR = "english-math/images/";
const AUDIO_DIR = "english-math/images/english-math/audio/";
const VIDEO_DIR = "english-math/videos/";

const englishMathData = [
    { num: 1, word: "One", img: "One1.jpg", audio: "One1.mp3" },

    { num: 21, word: "Twenty-One", img: "Twenty-One21.jpg", audio: "Twenty-One21.mp3" },
    { num: 22, word: "Twenty-Two", img: "Twenty-Two22.jpg", audio: "Twenty-Two22.mp3" },

    { num: 25, word: "Twenty-Five", img: "Twenty-Five25.jpg", audio: "Twenty-Five25.mp3" },
    { num: 26, word: "Twenty-Six", img: "Twenty-Six26.jpg", audio: "Twenty-Six26.mp3" },
    { num: 27, word: "Twenty-Seven", img: "Twenty-Seven27.jpg", audio: "Twenty-Seven27.mp3" },
    { num: 28, word: "Twenty-Eight", img: "Twenty-Eight28.jpg", audio: "Twenty-Eight28.mp3" },
    { num: 29, word: "Twenty-Nine", img: "Twenty-Nine29.jpg", audio: "Twenty-Nine29.mp3" },
    { num: 30, word: "Thirty", img: "Thirty30.jpg", audio: "Thirty30.mp3" },
    { num: 31, word: "Thirty-One", img: "Thirty-One31.jpg", audio: "Thirty-One31.mp3" },
    { num: 32, word: "Thirty-Two", img: "Thirty-Two32.jpg", audio: "Thirty-Two32.mp3" },
    { num: 33, word: "Thirty-Three", img: "Thirty-Three33.jpg", audio: "Thirty-Three33.mp3" },
    { num: 34, word: "Thirty-Four", img: "Thirty-Four34.jpg", audio: "Thirty-Four34.mp3" },
    { num: 35, word: "Thirty-Five", img: "Thirty-Five35.jpg", audio: "Thirty-Five35.mp3" },
    { num: 36, word: "Thirty-Six", img: "Thirty-Six36.jpg", audio: "Thirty-Six36.mp3" },
    { num: 37, word: "Thirty-Seven", img: "Thirty-Seven37.jpg", audio: "Thirty-Seven37.mp3" },
    { num: 38, word: "Thirty-Eight", img: "Thirty-Eight38.jpg", audio: "Thirty-Eight38.mp3" },
    { num: 39, word: "Thirty-Nine", img: "Thirty-Nine39.jpg", audio: "Thirty-Nine39.mp3" },
    { num: 40, word: "Forty", img: "Forty40.jpg", audio: "Forty40.mp3" },
    { num: 41, word: "Forty-One", img: "Forty-One41.jpg", audio: "Forty-One41.mp3" },
    { num: 42, word: "Forty-Two", img: "Forty-Two42.jpg", audio: "Forty-Two42.mp3" },
    { num: 43, word: "Forty-Three", img: "Forty-Three43.jpg", audio: "Forty-Three43.mp3" },
    { num: 44, word: "Forty-Four", img: "Forty-Four44.jpg", audio: "Forty-Four44.mp3" },
    { num: 45, word: "Forty-Five", img: "Forty-Five45.jpg", audio: "Forty-Five45.mp3" },
    { num: 46, word: "Forty-Six", img: "Forty-Six46.jpg", audio: "Forty-Six46.mp3" },
    { num: 47, word: "Forty-Seven", img: "Forty-Seven47.jpg", audio: "Forty-Seven47.mp3" },
    { num: 48, word: "Forty-Eight", img: "Forty-Eight48.jpg", audio: "Forty-Eight48.mp3" },
    { num: 49, word: "Forty-Nine", img: "Forty-Nine49.jpg", audio: "Forty-Nine49.mp3" },
    { num: 50, word: "Fifty", img: "Fifty50.jpg", audio: "Fifty50.mp3" }
];

let currentIndex = 0;
let explorerOpen = false;
let activeMediaType = "images";
const player = document.getElementById("voicePlayer");
let activeImgElement = null;
const sidebarButtons = [];

function getFileURL(path) {
    if (!path) return "";
    if (path.startsWith("http://") || path.startsWith("https://")) return path;
    return RAW_ROOT + path.split("/").map(part => encodeURIComponent(part)).join("/");
}

function playSound(path, imgElement) {
    if (activeImgElement) {
        activeImgElement.classList.remove("playing");
    }

    player.pause();
    player.src = getFileURL(path);

    activeImgElement = imgElement;
    if (activeImgElement) {
        activeImgElement.classList.add("playing");
    }

    player.play().catch(err => console.log("Audio error:", err));
}

player.addEventListener("ended", function() {
    if (activeImgElement) {
        activeImgElement.classList.remove("playing");
        activeImgElement = null;
    }
});

function buildSidebar() {
    const sidebar = document.getElementById("numberSidebar");
    englishMathData.forEach((item, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "side-num-btn";
        btn.textContent = item.num;
        btn.onclick = function() {
            showPage(idx);
        };
        sidebar.appendChild(btn);
        sidebarButtons.push(btn);
    });
}

function updateSidebarActive(index) {
    sidebarButtons.forEach((btn, idx) => {
        btn.classList.toggle("active", idx === index);
    });
    if (sidebarButtons[index]) {
        sidebarButtons[index].scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
}

function renderMediaDetails(box, item, type) {
    box.replaceChildren();
    const imgFile = IMG_DIR + item.img;
    const audioFile = AUDIO_DIR + item.audio;
    const videoFile = VIDEO_DIR + item.word.replace(/\s+/g, "") + item.num + ".mp4";

    const folderLine = document.createElement("div");
    const fileLine = document.createElement("div");
    fileLine.style.marginTop = "6px";

    if (type === "images") {
        folderLine.textContent = "Folder: " + IMG_DIR;
        fileLine.textContent = "Image File: " + imgFile;
    } else if (type === "audio") {
        folderLine.textContent = "Folder: " + AUDIO_DIR;
        fileLine.textContent = "Audio File: " + audioFile;
    } else {
        folderLine.textContent = "Folder: " + VIDEO_DIR;
        fileLine.textContent = "Video File: " + videoFile;
    }

    box.appendChild(folderLine);
    box.appendChild(fileLine);
}

function showPage(index) {
    if (index < 0 || index >= englishMathData.length) return;
    currentIndex = index;
    const item = englishMathData[index];
    const container = document.getElementById("bookContainer");
    container.replaceChildren();

    updateSidebarActive(index);

    const title = document.createElement("h2");
    title.className = "page-heading";
    title.textContent = "Learn English Counting";
    container.appendChild(title);

    const pageNum = document.createElement("div");
    pageNum.className = "page-number";
    pageNum.textContent = "Number " + item.num + " — Page " + (index + 1) + " / " + englishMathData.length;
    container.appendChild(pageNum);

    const toggleBtn = document.createElement("button");
    toggleBtn.type = "button";
    toggleBtn.className = "media-explorer-toggle";
    toggleBtn.textContent = "📂 Media Options (Images / Audio / Videos)";
    container.appendChild(toggleBtn);

    const panel = document.createElement("div");
    panel.className = "media-explorer-panel" + (explorerOpen ? " open" : "");

    const tabs = document.createElement("div");
    tabs.className = "media-tabs";

    const filesBox = document.createElement("div");
    filesBox.className = "media-files-box";

    const tabConfig = [
        { key: "images", label: "🖼️ Images" },
        { key: "audio", label: "🔊 Audio" },
        { key: "videos", label: "🎬 Videos" }
    ];

    const tabButtons = [];
    tabConfig.forEach(t => {
        const tBtn = document.createElement("button");
        tBtn.type = "button";
        tBtn.className = "media-tab-btn" + (activeMediaType === t.key ? " active" : "");
        tBtn.textContent = t.label;
        tBtn.onclick = function() {
            activeMediaType = t.key;
            tabButtons.forEach(b => b.classList.remove("active"));
            tBtn.classList.add("active");
            renderMediaDetails(filesBox, item, activeMediaType);
        };
        tabs.appendChild(tBtn);
        tabButtons.push(tBtn);
    });

    toggleBtn.onclick = function() {
        explorerOpen = !explorerOpen;
        panel.classList.toggle("open", explorerOpen);
    };

    renderMediaDetails(filesBox, item, activeMediaType);
    panel.appendChild(tabs);
    panel.appendChild(filesBox);
    container.appendChild(panel);

    const card = document.createElement("div");
    card.className = "single-card";

    const imgPath = IMG_DIR + item.img;
    const audioPath = AUDIO_DIR + item.audio;

    const imgElement = document.createElement("img");
    imgElement.src = getFileURL(imgPath);
    imgElement.alt = item.word;
    imgElement.className = "num-img";
    imgElement.onerror = function() {
        this.src = 'https://via.placeholder.com/400?text=' + encodeURIComponent(item.word);
    };
    imgElement.onclick = function() {
        playSound(audioPath, imgElement);
    };
    card.appendChild(imgElement);

    const wordDisplay = document.createElement("div");
    wordDisplay.className = "word-display";
    wordDisplay.textContent = item.num + " — " + item.word;
    card.appendChild(wordDisplay);

    const hint = document.createElement("div");
    hint.className = "hint-text";
    hint.textContent = "👆 Tap the image to listen";
    card.appendChild(hint);

    container.appendChild(card);

    const controls = document.createElement("div");
    controls.className = "page-controls";

    const prevBtn = document.createElement("button");
    prevBtn.className = "page-button";
    prevBtn.textContent = "← Previous";
    prevBtn.disabled = index === 0;
    prevBtn.onclick = function() {
        showPage(currentIndex - 1);
    };

    const pageIndicator = document.createElement("span");
    pageIndicator.className = "current-page";
    pageIndicator.textContent = (index + 1) + " of " + englishMathData.length;

    const nextBtn = document.createElement("button");
    nextBtn.className = "page-button";
    nextBtn.textContent = "Next →";
    nextBtn.disabled = index === englishMathData.length - 1;
    nextBtn.onclick = function() {
        showPage(currentIndex + 1);
    };

    controls.appendChild(prevBtn);
    controls.appendChild(pageIndicator);
    controls.appendChild(nextBtn);

    container.appendChild(controls);
}

buildSidebar();
showPage(0);
</script>

</body>
</html>
