<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Alphabet - Learn and Speak</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    padding: 18px 12px;
    background: linear-gradient(135deg,#e8fff3,#fff7df);
    color: #17352c;
}

header {
    text-align: center;
    margin-bottom: 20px;
}

.main-title {
    font-size: 28px;
    font-weight: 900;
    color: #07523d;
    margin-bottom: 8px;
}

.subtitle {
    color: #557267;
    line-height: 1.8;
    margin-bottom: 15px;
}

.language-switch {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 15px;
}

.language-btn {
    border: none;
    padding: 10px 22px;
    border-radius: 25px;
    font-size: 15px;
    font-weight: bold;
    background: white;
    color: #07523d;
    cursor: pointer;
    box-shadow: 0 3px 8px #0002;
    text-decoration: none;
    display: inline-block;
}

.language-btn.active {
    background: #087f5b;
    color: white;
}

.back-btn {
    display: inline-block;
    background: #e5a000;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
}

.app-container {
    max-width: 1050px;
    margin: auto;
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 18px;
    align-items: start;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 22px;
    box-shadow: 0 10px 28px #174c3610;
    border: 1px solid #d9e9e1;
}

.card-heading {
    font-size: 17px;
    font-weight: 900;
    color: #07523d;
    margin-bottom: 15px;
    text-align: center;
}

/* سائیڈ والی چھوٹی اے بی سی لسٹ */
.alphabet-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    max-height: 480px;
    overflow-y: auto;
    padding: 2px;
}

.letter-btn {
    min-height: 45px;
    border: 2px solid #dcebe3;
    border-radius: 10px;
    background: #f6fbf8;
    color: #174b38;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.letter-btn.selected,
.letter-btn:hover {
    background: #087f5b;
    color: white;
    border-color: #087f5b;
}

.lesson {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}

.lesson-box-large {
    background: #f2faf5;
    border: 2px solid #deeee4;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* بڑی اور خوبصورت تصویر جس پر ہاتھ کا نشان آئے گا */
.big-img-tag {
    width: 290px;
    height: 290px;
    object-fit: contain;
    display: block;
    margin: 10px auto;
    cursor: pointer;
    border-radius: 15px;
    transition: transform 0.2s ease;
}

.big-img-tag:active {
    transform: scale(0.96);
}

.big-letter {
    font-size: 50px;
    color: #087f5b;
    font-weight: 900;
    margin-bottom: 5px;
}

.action-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 15px 0;
}

.action-btn {
    border: none;
    border-radius: 25px;
    padding: 12px 25px;
    font-weight: bold;
    background: #e8f4ed;
    color: #07523d;
    cursor: pointer;
    font-size: 16px;
}

.action-btn.primary {
    background: #087f5b;
    color: white;
}

.action-btn:active,
.language-btn:active {
    transform: scale(.96);
}

.instruction {
    background: #fff6dc;
    border: 1px solid #f5e4ae;
    padding: 10px;
    border-radius: 12px;
    text-align: center;
    color: #805a0b;
    font-weight: bold;
    margin: 12px 0;
    line-height: 1.8;
}

.toolbar {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    margin: 12px 0;
}

.color-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 3px solid white;
    box-shadow: 0 2px 5px #0003;
    cursor: pointer;
}

.color-btn.active {
    outline: 2px solid #087f5b;
}

.clear-btn {
    background: #d94848;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 8px 15px;
    font-weight: bold;
    cursor: pointer;
}

.canvas-wrapper {
    position: relative;
    width: 100%;
    height: 200px;
    border: 2px dashed #9bbcaf;
    border-radius: 17px;
    overflow: hidden;
    background: repeating-linear-gradient(
        to bottom,
        #fff 0,
        #fff 71px,
        #edf4ef 72px,
        #fff 73px
    );
}

.target-letter {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 100px;
    font-weight: 900;
    color: #dce9e1;
    pointer-events: none;
    user-select: none;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
}

.progress {
    text-align: center;
    font-size: 13px;
    margin-top: 10px;
    color: #658073;
}

footer {
    text-align: center;
    margin-top: 22px;
    color: #789086;
    font-size: 13px;
}

@media(max-width:760px) {
    .app-container {
        grid-template-columns: 1fr;
    }
    .alphabet-grid {
        grid-template-columns: repeat(6, 1fr);
        max-height: 220px;
    }
    .big-img-tag {
        width: 220px;
        height: 220px;
    }
}
</style>
</head>

<body>

<header>
    <h1 class="main-title">📚 English Alphabet - Learn and Speak</h1>
    <p class="subtitle">Let's learn English letters and pronunciation!</p>

    <!-- Language Switcher Buttons -->
    <div class="language-switch">
        <a class="language-btn" href="index.html">سنڌي</a>
        <a class="language-btn active" href="english.html">English</a>
    </div>

    <button class="back-btn" onclick="playCurrentAudio()">🔊 Listen Letter</button>
</header>

<div class="app-container">

    <!-- سائیڈ میں چھوٹی اے بی سی لسٹ -->
    <div class="card">
        <h2 class="card-heading">🔤 Alphabet</h2>
        <div class="alphabet-grid" id="alphabetGrid"></div>
    </div>

    <!-- مین سیکشن: بڑی تصویر اور لیسن -->
    <div class="card">
        <h2 class="card-heading">👀 Read, Listen and Learn</h2>

        <div class="lesson">
            <div class="lesson-box-large">
                <div class="big-letter" id="shownLetter">Aa</div>
                <!-- تصویر پر کلک کرنے سے آڈیو چلے گی -->
                <img id="exampleImgTag" src="" alt="Alphabet" class="big-img-tag" onclick="playCurrentAudio()" title="Click to hear voice!">
                <div style="font-size: 13px; color: #557267; margin-top: 5px;">👆 تصویر پر ٹچ کریں یا نیچے بٹن دبائیں</div>
            </div>
        </div>

        <div class="action-row">
            <button class="action-btn primary" onclick="playCurrentAudio()">🔊 Play Sound</button>
            <button class="action-btn" onclick="previousLetter()">◀ Previous</button>
            <button class="action-btn" onclick="nextLetter()">Next ▶</button>
        </div>

        <div class="instruction">
            ✍️ Look at the light letter below and write it with your finger.
        </div>

        <!-- Pen colors -->
        <div class="toolbar">
            <button class="color-btn active" style="background:#17352c" onclick="setColor('#17352c',this)"></button>
            <button class="color-btn" style="background:#e03131" onclick="setColor('#e03131',this)"></button>
            <button class="color-btn" style="background:#1971c2" onclick="setColor('#1971c2',this)"></button>
            <button class="color-btn" style="background:#2f9e44" onclick="setColor('#2f9e44',this)"></button>
            <button class="clear-btn" onclick="clearCanvas()">🧽 Clear</button>
        </div>

        <!-- Writing board -->
        <div class="canvas-wrapper">
            <div class="target-letter" id="targetLetter">A</div>
            <canvas id="drawingCanvas"></canvas>
        </div>

        <div class="progress" id="progress">Letter 1 / 26</div>
    </div>

</div>

<footer>
    Learning English is fun! ❤️
</footer>

<!-- آڈیو چلانے کے لیے پلئیر -->
<audio id="voicePlayer"></audio>

<script>
// ===================================
// A to Z Images (Aa.jpg to Zz.jpg) and Audios (Aa.mp3 to Zz.mp3)
// ===================================

const alphabet = [
    {letter:"Aa", img:"media/images/Aa.jpg", audio:"Aa.mp3"},
    {letter:"Bb", img:"media/images/Bb.jpg", audio:"Bb.mp3"},
    {letter:"Cc", img:"media/images/Cc.jpg", audio:"Cc.mp3"},
    {letter:"Dd", img:"media/images/Dd.jpg", audio:"Dd.mp3"},
    {letter:"Ee", img:"media/images/Ee.jpg", audio:"Ee.mp3"},
    {letter:"Ff", img:"media/images/Ff.jpg", audio:"Ff.mp3"},
    {letter:"Gg", img:"media/images/Gg.jpg", audio:"Gg.mp3"},
    {letter:"Hh", img:"media/images/Hh.jpg", audio:"Hh.mp3"},
    {letter:"Ii", img:"media/images/Ii.jpg", audio:"Ii.jpg"},
    {letter:"Jj", img:"media/images/Jj.jpg", audio:"Jj.mp3"},
    {letter:"Kk", img:"media/images/Kk.jpg", audio:"Kk.mp3"},
    {letter:"Ll", img:"media/images/Ll.jpg", audio:"Ll.mp3"},
    {letter:"Mm", img:"media/images/Mm.jpg", audio:"Mm.mp3"},
    {letter:"Nn", img:"media/images/Nn.jpg", audio:"Nn.mp3"},
    {letter:"Oo", img:"media/images/Oo.jpg", audio:"Oo.mp3"},
    {letter:"Pp", img:"media/images/Pp.jpg", audio:"Pp.mp3"},
    {letter:"Qq", img:"media/images/Qq.jpg", audio:"Qq.mp3"},
    {letter:"Rr", img:"media/images/Rr.jpg", audio:"Rr.mp3"},
    {letter:"Ss", img:"media/images/Ss.jpg", audio:"Ss.mp3"},
    {letter:"Tt", img:"media/images/Tt.jpg", audio:"Tt.mp3"},
    {letter:"Uu", img:"media/images/Uu.jpg", audio:"Uu.mp3"},
    {letter:"Vv", img:"media/images/Vv.jpg", audio:"Vv.mp3"},
    {letter:"Ww", img:"media/images/Ww.jpg", audio:"Ww.mp3"},
    {letter:"Xx", img:"media/images/Xx.jpg", audio:"Xx.mp3"},
    {letter:"Yy", img:"media/images/Yy.jpg", audio:"Yy.mp3"},
    {letter:"Zz", img:"media/images/Zz.jpg", audio:"Zz.mp3"}
];

const grid = document.getElementById("alphabetGrid");
let currentIndex = 0;
let penColor = "#17352c";
let drawing = false;

const player = document.getElementById("voicePlayer");

// Create alphabet buttons dynamically (Small buttons on sidebar)
alphabet.forEach((item, index) => {
    const btn = document.createElement("button");
    btn.className = "letter-btn";
    btn.textContent = item.letter.charAt(0);
    btn.onclick = () => {
        selectLetter(index);
        playCurrentAudio();
    };
    grid.appendChild(btn);
});

// Select a letter
function selectLetter(index) {
    currentIndex = (index + alphabet.length) % alphabet.length;
    const item = alphabet[currentIndex];

    document.getElementById("shownLetter").textContent = item.letter;
    
    // بڑی تصویر سیٹ کرنا
    document.getElementById("exampleImgTag").src = item.img;
    
    document.getElementById("targetLetter").textContent = item.letter.charAt(0);
    document.getElementById("progress").textContent = `Letter ${currentIndex+1} / ${alphabet.length}`;

    document.querySelectorAll(".letter-btn").forEach((btn, i) => {
        btn.classList.toggle("selected", i === currentIndex);
    });

    clearCanvas();
}

// آڈیو چلانے کا فنکشن (media/english-audio/ سے آڈیو اٹھائے گا)
function playCurrentAudio() {
    const item = alphabet[currentIndex];
    player.src = "media/english-audio/" + item.audio;
    player.play().catch(error => {
        console.log("Audio play error:", error);
    });
}

function nextLetter() {
    selectLetter(currentIndex + 1);
    playCurrentAudio();
}

function previousLetter() {
    selectLetter(currentIndex - 1);
    playCurrentAudio();
}

// Drawing Board Code
const canvas = document.getElementById("drawingCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    const oldCanvas = document.createElement("canvas");
    oldCanvas.width = canvas.width;
    oldCanvas.height = canvas.height;

    if (oldCanvas.width && oldCanvas.height) {
        oldCanvas.getContext("2d").drawImage(canvas, 0, 0);
    }

    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    if (oldCanvas.width && oldCanvas.height) {
        ctx.drawImage(oldCanvas, 0, 0, oldCanvas.width, oldCanvas.height, 0, 0, rect.width, rect.height);
    }
}

function setColor(color, element) {
    penColor = color;
    document.querySelectorAll(".color-btn").forEach(btn => btn.classList.remove("active"));
    element.classList.add("active");
}

function clearCanvas() {
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
}

function getPosition(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}

canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    const pos = getPosition(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
});

canvas.addEventListener("pointermove", e => {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPosition(e);
    ctx.strokeStyle = penColor;
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
});

function stopDrawing() {
    drawing = false;
    ctx.closePath();
}

canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointercancel", stopDrawing);
canvas.addEventListener("lostpointercapture", stopDrawing);

window.addEventListener("resize", resizeCanvas);

// Initialize
resizeCanvas();
selectLetter(0);
</script>

</body>
</html>
